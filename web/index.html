<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>勝ちパターン探知機</title>
<meta name="theme-color" content="#102442">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="勝ちパターン">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --raised: #ffffff;
  --ink: #0b0b0b;
  --ink2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --wash: rgba(11, 11, 11, 0.045);
  --accent: #2a78d6;
  --accent-ink: #1c5cab;
  --accent-wash: rgba(42, 120, 214, 0.10);
  --s1: #2a78d6;
  --s2: #eb6834;
  --good: #0ca30c;
  --good-ink: #006300;
  --f1: #86b6ef; --f2: #5598e7; --f3: #2a78d6; --f4: #1c5cab;
  --bar: #102442;
  --shadow: 0 8px 28px rgba(11, 11, 11, 0.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --raised: #222220;
    --ink: #ffffff;
    --ink2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.06);
    --accent: #3987e5;
    --accent-ink: #86b6ef;
    --accent-wash: rgba(57, 135, 229, 0.16);
    --s1: #3987e5;
    --s2: #d95926;
    --good: #0ca30c;
    --good-ink: #0ca30c;
    --f1: #184f95; --f2: #256abf; --f3: #3987e5; --f4: #6da7ec;
    --bar: #0b1a30;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Hiragino Sans", "Segoe UI", "Noto Sans JP", sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; }

/* ---- app bar ---- */
.app-bar {
  background: var(--bar);
  color: #fff;
  padding-top: env(safe-area-inset-top);
}
.app-bar .wrap { padding-block: 14px 16px; }
.app-bar h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.02em; }
.app-bar .meta { margin-top: 2px; font-size: 13px; color: rgba(255, 255, 255, 0.72); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.badge-warn { background: #fab219; color: #0b0b0b; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; }

main.wrap { padding-block: 14px 32px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
main.wrap > * { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
.card h2 { margin: 0; font-size: 15px; font-weight: 700; }
.row-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sub { color: var(--ink2); font-size: 13px; }
.muted { color: var(--muted); }

.banner { background: var(--accent-wash); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--ink2); }
.banner strong { color: var(--ink); }

/* ---- theme chips ---- */
.genre { margin-top: 12px; }
.genre-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 36px; padding: 6px 12px;
  border-radius: 999px; border: 1px solid var(--border);
  background: var(--raised); color: var(--ink);
  font-size: 14px; line-height: 1.2;
  -webkit-tap-highlight-color: transparent;
}
.chip .box {
  width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--axis);
  display: inline-grid; place-items: center; flex: none;
}
.chip[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.chip[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.chip[aria-pressed="true"] .box::after { content: ""; width: 8px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.chip .n { color: var(--muted); font-weight: 400; font-size: 12px; }
.chip.zero { color: var(--muted); }
.btn-text { background: none; border: 0; color: var(--accent-ink); font-size: 14px; padding: 6px 4px; }
.btn-text:disabled { color: var(--muted); cursor: default; }
details.sectors { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
details.sectors summary { list-style: none; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; min-height: 36px; }
details.sectors summary::-webkit-details-marker { display: none; }
details.sectors summary::after { content: "＋"; color: var(--muted); font-weight: 400; }
details.sectors[open] summary::after { content: "－"; }
details.sectors .chips { margin-top: 8px; }
.selection-line { margin-top: 12px; font-size: 13px; color: var(--ink2); }

/* ---- funnel ---- */
.funnel { margin-top: 10px; display: grid; gap: 4px; }
.f-row {
  display: grid; grid-template-columns: 7.2em 1fr 3.6em; align-items: center; gap: 10px;
  width: 100%; background: none; border: 0; padding: 7px 4px; border-radius: 8px; text-align: left;
  -webkit-tap-highlight-color: transparent;
}
.f-row:active, .f-row:hover { background: var(--wash); }
.f-row[aria-current="true"] { background: var(--wash); }
.f-label { font-size: 13px; color: var(--ink2); }
.f-track { height: 14px; border-radius: 0 4px 4px 0; position: relative; }
.f-bar { height: 14px; border-radius: 0 4px 4px 0; min-width: 3px; }
.f-num { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.f-drop { font-size: 12px; color: var(--muted); padding-left: calc(7.2em + 14px); margin-top: -2px; margin-bottom: 2px; }

/* ---- list ---- */
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; min-height: 36px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface); font-size: 14px; color: var(--ink2);
}
.tab[aria-selected="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); font-weight: 600; }
.tab .n { font-variant-numeric: tabular-nums; margin-left: 4px; opacity: 0.75; }
.tools { display: flex; gap: 8px; margin-top: 10px; }
.tools input, .tools select {
  min-height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); padding: 8px 10px;
}
.tools input { flex: 1; min-width: 0; }
.tools select { flex: none; max-width: 42%; }
.tab-note { font-size: 13px; color: var(--ink2); margin: 10px 2px 0; }
ul.list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.item {
  width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
  -webkit-tap-highlight-color: transparent;
}
.item:active { background: var(--wash); }
.item .name { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .code { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .metric { grid-row: 1 / span 2; grid-column: 2; text-align: right; }
.item .metric b { display: block; font-size: 20px; font-weight: 700; line-height: 1.1; }
.item .metric small { color: var(--muted); font-size: 11px; }
.item .facts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--ink2); margin-top: 4px; }
.empty { text-align: center; color: var(--ink2); padding: 28px 12px; font-size: 14px; }
.more { width: 100%; margin-top: 10px; min-height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--accent-ink); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--wash); color: var(--ink2); }
.pill.pass { color: var(--good-ink); background: rgba(12, 163, 12, 0.12); font-weight: 600; }
.pill.pass::before { content: "✓"; font-weight: 700; }

footer.foot { font-size: 13px; color: var(--ink2); display: grid; gap: 10px; }
footer.foot .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
details.help summary { cursor: pointer; font-weight: 600; min-height: 32px; }
details.help ul { margin: 6px 0 0; padding-left: 1.2em; }

/* ---- detail sheet ---- */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none; }
.sheet .scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.42); }
.sheet .panel {
  position: relative; width: 100%; max-width: 560px; max-height: 94dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--page); border-radius: 18px 18px 0 0; box-shadow: var(--shadow);
  padding: 0 16px calc(24px + env(safe-area-inset-bottom));
  animation: up 0.18s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet .panel { animation: none; } }
.sheet-top { position: sticky; top: 0; z-index: 2; background: var(--page); display: flex; align-items: center; justify-content: space-between; padding: 10px 0 8px; }
.grab { position: absolute; top: 6px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 4px; background: var(--axis); }
.close { background: var(--wash); border: 0; border-radius: 999px; min-height: 36px; padding: 6px 14px; font-size: 14px; margin-top: 6px; }
.d-head h3 { margin: 0; font-size: 22px; line-height: 1.3; }
.d-head .code { color: var(--muted); font-size: 13px; margin-top: 2px; }
.d-head .price { margin-top: 8px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.d-head .price b { font-size: 26px; font-weight: 700; }
.why { margin-top: 12px; font-size: 14px; color: var(--ink2); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
.section { margin-top: 16px; }
.section h4 { margin: 0 0 8px; font-size: 14px; color: var(--ink2); font-weight: 700; }
.seg { display: inline-flex; background: var(--wash); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 8px; min-height: 32px; padding: 4px 12px; font-size: 13px; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
.chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 10px 6px; margin-top: 10px; }
.chart-title { font-size: 13px; color: var(--ink2); padding: 0 4px 4px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--ink2); }
.legend i { display: inline-block; width: 14px; height: 2px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart rect:focus { outline: none; }
.chart rect:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tip {
  position: absolute; top: 0; pointer-events: none; background: var(--raised); border: 1px solid var(--border);
  border-radius: 10px; padding: 6px 9px; font-size: 12px; box-shadow: var(--shadow); white-space: nowrap; color: var(--ink2);
}
.tip b { color: var(--ink); font-size: 14px; }
.tip .r { display: flex; align-items: center; gap: 6px; }
.tip .r i { width: 12px; height: 2px; border-radius: 2px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
.stat .l { font-size: 12px; color: var(--ink2); }
.stat .v { font-size: 20px; font-weight: 700; line-height: 1.25; }
.stat .h { font-size: 11px; color: var(--muted); }
.box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 14px; }
.news { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
.news a { display: block; text-decoration: none; color: var(--ink); padding: 8px 2px; border-bottom: 1px solid var(--border); }
.news li:last-child a { border-bottom: 0; }
.news .d { color: var(--muted); font-size: 12px; margin-right: 6px; font-variant-numeric: tabular-nums; }
.link-row { display: flex; flex-wrap: wrap; gap: 8px; }
.link-row .btn { flex: 1 1 140px; }
.ai-score { font-size: 28px; font-weight: 700; }
.tbl-wrap { overflow-x: auto; margin-top: 6px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: right; font-weight: 600; color: var(--ink2); padding: 6px 6px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
.tbl td { text-align: right; padding: 6px 6px; border-bottom: 1px solid var(--grid); white-space: pre; line-height: 1.35; }
.tbl td:first-child { white-space: normal; min-width: 6.5em; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl tr.best td { font-weight: 700; }
details.bt summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
details.bt summary::-webkit-details-marker { display: none; }
details.bt summary::after { content: "＋"; color: var(--muted); }
details.bt[open] summary::after { content: "－"; }
.bt h5 { margin: 14px 0 2px; font-size: 13px; color: var(--ink2); }
.bt ul.cav { margin: 6px 0 0; padding-left: 1.2em; font-size: 12px; color: var(--muted); }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 14px; font-size: 14px; z-index: 40;
  width: max-content; max-width: calc(100% - 32px); text-align: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.toast.show { opacity: 1; }
.loading { text-align: center; padding: 40px 0; color: var(--ink2); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<header class="app-bar">
  <div class="wrap">
    <h1>勝ちパターン探知機</h1>
    <div class="meta" id="meta">読み込み中…</div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="loading" id="loading">最新の計算結果を読み込み中…</div>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="d-title" id="panel"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* =========================================================================
   勝ちパターン探知機 — スマホ画面
   data/results.json(GitHub Actionsが毎日作る)を読み込んで、
   テーマ選択・絞り込みの様子・候補/脱落銘柄・グラフをすべて端末内で表示する。
   ========================================================================= */

const STATUS = {
  pass: { label: "候補", tab: "候補" },
  nobottom: { label: "底打ちなし", tab: "底打ちなし" },
  high: { label: "底値圏外", tab: "底値圏外" },
  nodata: { label: "データなし", tab: "データなし" },
};
const TAB_ORDER = ["pass", "nobottom", "high", "nodata"];
const PAGE = 60;

const state = {
  data: null,
  demo: false,
  themes: new Set(),
  sectors: new Set(),
  tab: "pass",
  sort: "best",
  q: "",
  shown: PAGE,
};

/* ---------- small helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return n;
}
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs = {}) {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) n.setAttribute(k, v);
  return n;
}
const pct = (v, sign = false) => (v == null ? "-" : `${sign && v > 0 ? "+" : ""}${Math.round(v * 100)}%`);
const yen = (v) => (v == null ? "-" : v.toLocaleString("ja-JP", { maximumFractionDigits: v < 100 ? 1 : 0 }));
const code = (t) => t.replace(/\.T$/, "");
function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (_) {} }
function recall(key, fb) { try { const v = localStorage.getItem(key); return v == null ? fb : JSON.parse(v); } catch (_) { return fb; } }
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}
function safeUrl(u) { return typeof u === "string" && /^https:\/\//.test(u) ? u : null; }

/* ---------- GitHub上の再計算ページ ---------- */
function actionsUrl() {
  const h = location.hostname;
  if (!h.endsWith(".github.io")) return null;
  const owner = h.split(".")[0];
  const repo = location.pathname.split("/").filter(Boolean)[0] || `${owner}.github.io`;
  return `https://github.com/${owner}/${repo}/actions/workflows/screen.yml`;
}

/* ---------- データ読み込み ---------- */
async function load() {
  const params = new URLSearchParams(location.search);
  if (params.has("demo")) return start(makeDemo(), true);
  try {
    const res = await fetch("data/results.json", { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    start(await res.json(), false);
  } catch (e) {
    showNoData();
  }
}

function showNoData() {
  $("#meta").textContent = "まだ計算結果がありません";
  const main = $("#main");
  main.replaceChildren(
    el("section", { class: "card" },
      el("h2", { text: "計算結果がまだありません" }),
      el("p", { class: "sub", text: "GitHubで最初の自動計算が終わると、ここに結果が出ます(初回は30分〜1時間ほど)。今は画面のイメージだけ確認できます。" }),
      el("div", { class: "link-row" },
        el("button", { class: "btn primary", onclick: () => start(makeDemo(), true) }, "デモを見る"),
        actionsUrl() ? el("a", { class: "btn", href: actionsUrl(), target: "_blank", rel: "noopener" }, "計算を実行する") : null,
      ),
    ),
  );
}

function start(data, demo) {
  state.data = data;
  state.demo = demo;
  const knownThemes = new Set(Object.values(data.genres || {}).flat());
  state.themes = new Set(recall("themes", []).filter((t) => knownThemes.has(t)));
  state.sectors = new Set(recall("sectors", []).filter((s) => (data.sectors || []).includes(s)));
  state.tab = recall("tab", "pass");
  state.sort = recall("sort", "best");
  renderShell();
  render();
}

/* ---------- 画面の骨組み ---------- */
function renderShell() {
  const d = state.data;
  const gen = new Date(d.generated_at);
  const ageDays = (Date.now() - gen.getTime()) / 864e5;
  const meta = $("#meta");
  meta.replaceChildren(...[
    el("span", { text: `${gen.getMonth() + 1}/${gen.getDate()} ${String(gen.getHours()).padStart(2, "0")}:${String(gen.getMinutes()).padStart(2, "0")} 更新` }),
    el("span", { text: `全${d.universe_count.toLocaleString()}銘柄` }),
    !state.demo && ageDays > 4 ? el("span", { class: "badge-warn", text: "更新が止まってるかも" }) : null,
    state.demo ? el("span", { class: "badge-warn", text: "デモ" }) : null,
  ].filter(Boolean));

  const main = $("#main");
  main.replaceChildren();
  if (state.demo) {
    main.append(el("div", { class: "banner" },
      el("strong", { text: "デモ表示中:" }), " 銘柄名・株価はすべて架空です。本番は毎日の自動計算結果が表示されます。"));
  }

  /* テーマ選択 */
  const picker = el("section", { class: "card", "aria-labelledby": "h-theme" });
  const clearBtn = el("button", { class: "btn-text", id: "clear", onclick: () => { state.themes.clear(); state.sectors.clear(); persistSel(); render(); } }, "選択を解除");
  picker.append(el("div", { class: "row-head" }, el("h2", { id: "h-theme", text: "テーマ" }), clearBtn));

  const counts = themeCounts();
  for (const [genre, themes] of Object.entries(d.genres || {})) {
    const chips = el("div", { class: "chips" });
    for (const t of themes) chips.append(chip(t, "theme", counts.themes[t] || 0));
    picker.append(el("div", { class: "genre" }, el("div", { class: "genre-label", text: genre }), chips));
  }
  const secChips = el("div", { class: "chips" });
  for (const s of d.sectors || []) secChips.append(chip(s, "sector", counts.sectors[s] || 0));
  const det = el("details", { class: "sectors", id: "sec-det" },
    el("summary", {}, el("span", { id: "sec-sum", text: "業種(東証33業種)で選ぶ" })), secChips);
  if (recall("secOpen", false)) det.open = true;
  det.addEventListener("toggle", () => store("secOpen", det.open));
  picker.append(det, el("div", { class: "selection-line", id: "sel-line" }));
  main.append(picker);

  /* 絞り込み */
  main.append(el("section", { class: "card", "aria-labelledby": "h-funnel" },
    el("div", { class: "row-head" }, el("h2", { id: "h-funnel", text: "絞り込みの様子" }), el("span", { class: "sub", text: "タップで一覧へ" })),
    el("div", { class: "funnel", id: "funnel" })));

  /* 一覧 */
  const tabs = el("div", { class: "tabs", role: "tablist", id: "tabs" });
  for (const st of TAB_ORDER) {
    tabs.append(el("button", { class: "tab", role: "tab", "data-st": st, onclick: () => setTab(st) }, STATUS[st].tab, el("span", { class: "n" })));
  }
  const search = el("input", { type: "search", placeholder: "銘柄名・コードで検索", "aria-label": "銘柄名・コードで検索", value: state.q });
  search.addEventListener("input", () => { state.q = search.value.trim(); state.shown = PAGE; renderList(); });
  const sort = el("select", { "aria-label": "並び順", id: "sort" });
  sort.addEventListener("change", () => { state.sort = sort.value; store("sort", state.sort); state.shown = PAGE; renderList(); });
  main.append(el("section", { id: "list-sec", "aria-label": "銘柄一覧" },
    tabs,
    el("div", { class: "tools" }, search, sort),
    el("p", { class: "tab-note", id: "tab-note" }),
    el("ul", { class: "list", id: "list" }),
    el("div", { id: "more-slot" })));

  /* 過去の成績(バックテスト) */
  const btBox = el("div", { id: "bt-body", class: "sub", text: "読み込み中…" });
  const btDet = el("details", { class: "bt" }, el("summary", {}, el("h2", { text: "過去の成績(バックテスト)" })), btBox);
  btDet.addEventListener("toggle", () => { if (btDet.open && !btDet.dataset.loaded) { btDet.dataset.loaded = "1"; loadBacktest(btBox); } });
  main.append(el("section", { class: "card" }, btDet));

  /* フッター */
  const p = d.params || {};
  const au = actionsUrl();
  main.append(el("footer", { class: "foot card" },
    el("div", { class: "actions" },
      au ? el("a", { class: "btn", href: au, target: "_blank", rel: "noopener" }, "↻ 今すぐ再計算") : null,
      el("button", { class: "btn", onclick: () => location.reload() }, "再読み込み")),
    au ? el("div", { class: "sub", text: "「今すぐ再計算」はGitHubのページが開くので「Run workflow」を押す。30分〜1時間後に反映。普段は平日16:30に自動で計算される。" }) : null,
    el("details", { class: "help" },
      el("summary", { text: "判定のしかた" }),
      el("ul", {},
        el("li", { text: `底値圏: 過去5年の値幅のうち下から${Math.round((p.near_low ?? 0.3) * 100)}%以内` }),
        el("li", { text: `底打ち: 直近3ヶ月で${Math.round((p.min_decline ?? 0.15) * 100)}%以上下げたあと、底から+${Math.round((p.min_rebound ?? 0.1) * 100)}%以上反発(底から3営業日以上)` }),
        el("li", { text: `類似度: 底をつけてからの上昇カーブの形が、勝ちパターン銘柄(${(d.refs || []).join("・") || "-"})の底からの上昇とどれだけ似ているか(0〜1)` }),
        el("li", { text: "業績・ニュースは候補に残った銘柄だけ取得(業績はyfinance、ニュースはGoogleニュース)" }))),
    el("div", { class: "muted", text: "株価: Yahoo Finance(yfinance)/銘柄一覧: JPX。投資助言ではなく、自分で判断するための参考情報。" })));

  syncSort();
}

function chip(name, kind, n) {
  const set = kind === "theme" ? state.themes : state.sectors;
  const b = el("button", { class: n ? "chip" : "chip zero", "aria-pressed": String(set.has(name)), "data-kind": kind, "data-name": name },
    el("span", { class: "box", "aria-hidden": "true" }), name, el("span", { class: "n", text: n ? String(n) : "0" }));
  b.addEventListener("click", () => {
    set.has(name) ? set.delete(name) : set.add(name);
    b.setAttribute("aria-pressed", String(set.has(name)));
    persistSel();
    state.shown = PAGE;
    render();
  });
  return b;
}
function persistSel() { store("themes", [...state.themes]); store("sectors", [...state.sectors]); }

function themeCounts() {
  const themes = {}, sectors = {};
  for (const s of state.data.stocks) {
    for (const t of s.th || []) themes[t] = (themes[t] || 0) + 1;
    sectors[s.s] = (sectors[s.s] || 0) + 1;
  }
  return { themes, sectors };
}

/* ---------- 絞り込みロジック(STEP1はここで端末内処理) ---------- */
function selected() {
  const all = state.data.stocks;
  if (!state.themes.size && !state.sectors.size) return all;
  return all.filter((s) => state.sectors.has(s.s) || (s.th || []).some((t) => state.themes.has(t)));
}

function render() {
  const pool = selected();
  for (const c of document.querySelectorAll(".chip")) {
    const set = c.dataset.kind === "theme" ? state.themes : state.sectors;
    c.setAttribute("aria-pressed", String(set.has(c.dataset.name)));
  }
  $("#clear").disabled = !state.themes.size && !state.sectors.size;
  const nSel = state.themes.size + state.sectors.size;
  $("#sec-sum").textContent = state.sectors.size ? `業種(東証33業種)で選ぶ ・ ${state.sectors.size}件選択中` : "業種(東証33業種)で選ぶ";
  const names = [...state.themes, ...state.sectors];
  $("#sel-line").textContent = nSel
    ? `${names.slice(0, 2).join("・")}${nSel > 2 ? ` ほか${nSel - 2}件` : ""} → ${pool.length.toLocaleString()}銘柄が対象`
    : `未選択 = 全${pool.length.toLocaleString()}銘柄が対象`;

  const by = { pass: 0, nobottom: 0, high: 0, nodata: 0 };
  for (const s of pool) by[s.st] = (by[s.st] || 0) + 1;
  const stages = [
    { label: "対象", n: pool.length, tab: null, color: "--f1" },
    { label: "株価あり", n: pool.length - by.nodata, drop: by.nodata, tab: "nodata", color: "--f2" },
    { label: "底値圏", n: by.nobottom + by.pass, drop: by.high, tab: "high", color: "--f3" },
    { label: "底打ち=候補", n: by.pass, drop: by.nobottom, tab: "pass", dropTab: "nobottom", color: "--f4" },
  ];
  const f = $("#funnel");
  f.replaceChildren();
  const max = Math.max(1, stages[0].n);
  stages.forEach((st, i) => {
    // 最後の段(候補)だけタップで候補一覧へ。途中の段は「脱落した銘柄」の行から各一覧へ飛べる。
    const isLast = i === stages.length - 1;
    const parts = [
      el("span", { class: "f-label", text: st.label }),
      el("span", { class: "f-track" }, el("span", { class: "f-bar", style: `display:block;width:${(st.n / max) * 100}%;background:var(${st.color})` })),
      el("span", { class: "f-num", text: st.n.toLocaleString() }),
    ];
    f.append(isLast
      ? el("button", { class: "f-row", "aria-current": String(state.tab === "pass"), "aria-label": `候補 ${st.n}銘柄を見る`, onclick: () => setTab("pass", true) }, ...parts)
      : el("div", { class: "f-row" }, ...parts));
    if (i > 0 && st.drop) {
      const dropTab = st.dropTab || st.tab;
      const reason = { nodata: "データなし", high: "底値圏より上", nobottom: "底打ちしてない" }[dropTab];
      f.append(el("div", { class: "f-drop" },
        el("button", { class: "btn-text", style: "font-size:12px;padding:0", onclick: () => setTab(dropTab, true) }, `↳ ${st.drop.toLocaleString()}銘柄が脱落(${reason})`)));
    }
  });

  for (const b of document.querySelectorAll(".tab")) {
    b.setAttribute("aria-selected", String(b.dataset.st === state.tab));
    b.querySelector(".n").textContent = (by[b.dataset.st] || 0).toLocaleString();
  }
  renderList(pool);
}

function setTab(st, scroll) {
  state.tab = st;
  state.shown = PAGE;
  store("tab", st);
  syncSort();
  render();
  if (scroll) $("#list-sec").scrollIntoView({ behavior: "smooth", block: "start" });
}

function syncSort() {
  const sel = $("#sort");
  if (!sel) return;
  const opts = state.tab === "pass"
    ? [["best", "おすすめ順"], ["sim", "類似度が高い順"], ["reb", "反発が大きい順"], ["pos", "株価位置が低い順"]]
    : state.tab === "nobottom"
      ? [["sim", "類似度が高い順"], ["pos", "株価位置が低い順"], ["reb", "反発が大きい順"], ["name", "コード順"]]
      : [["pos", "株価位置が低い順"], ["reb", "反発が大きい順"], ["name", "コード順"]];
  if (!opts.some(([v]) => v === state.sort)) state.sort = opts[0][0];
  sel.replaceChildren(...opts.map(([v, l]) => el("option", { value: v, text: l })));
  sel.value = state.sort;
}

function sortStocks(list) {
  const k = state.sort;
  const num = (v, fb) => (v == null ? fb : v);
  const cmp = {
    best: (a, b) => num(b.ai?.score, -1) - num(a.ai?.score, -1) || num(b.sim, 0) - num(a.sim, 0),
    sim: (a, b) => num(b.sim, 0) - num(a.sim, 0),
    reb: (a, b) => num(b.reb, -9) - num(a.reb, -9),
    pos: (a, b) => num(a.pos, 9) - num(b.pos, 9),
    name: (a, b) => a.t.localeCompare(b.t),
  }[k];
  return list.slice().sort(cmp);
}

function renderList(pool = selected()) {
  const q = state.q.toLowerCase();
  let list = pool.filter((s) => s.st === state.tab);
  if (q) list = list.filter((s) => s.n.toLowerCase().includes(q) || s.t.toLowerCase().includes(q));
  list = sortStocks(list);

  const notes = {
    pass: "底値圏にいて、直近で底打ちした銘柄。タップでグラフ・業績・ニュース。",
    nobottom: "底値圏にはいるけど、まだ底打ちの形になってない銘柄。類似度が高いものは「反発前の早い段階」の可能性。",
    high: "5年の値幅の中で、まだ底値圏まで下がってない銘柄。",
    nodata: "株価が取れなかった銘柄(上場直後・売買停止など)。",
  };
  $("#tab-note").textContent = notes[state.tab];

  const ul = $("#list");
  ul.replaceChildren();
  if (!list.length) {
    ul.append(el("li", { class: "empty", text: q ? "検索に一致する銘柄なし" : state.tab === "pass" ? "今日は候補なし。テーマを増やすか、全銘柄で見てみて。" : "該当なし" }));
  }
  for (const s of list.slice(0, state.shown)) ul.append(el("li", {}, row(s)));
  const slot = $("#more-slot");
  slot.replaceChildren();
  if (list.length > state.shown) {
    slot.append(el("button", { class: "more", onclick: () => { state.shown += PAGE; renderList(); } },
      `もっと見る(残り${(list.length - state.shown).toLocaleString()}件)`));
  }
}

function row(s) {
  let metric;
  if (s.st === "pass") {
    metric = s.ai ? el("span", { class: "metric" }, el("b", { text: s.ai.score.toFixed(2) }), el("small", { text: "AIスコア" }))
      : el("span", { class: "metric" }, el("b", { text: (s.sim ?? 0).toFixed(2) }), el("small", { text: "類似度" }));
  } else if (s.st === "nodata") {
    metric = el("span", { class: "metric" }, el("b", { text: "-" }));
  } else {
    metric = el("span", { class: "metric" }, el("b", { text: pct(s.pos) }), el("small", { text: "5年位置" }));
  }
  const facts = [];
  if (s.st !== "nodata") {
    if (s.st === "pass") facts.push(`5年位置 ${pct(s.pos)}`);
    facts.push(`3ヶ月 ${s.dec != null ? "-" + Math.round(s.dec * 100) + "%" : "-"}→底から${pct(s.reb, true)}`);
    if (s.earn) facts.push(`業績 ${s.earn.trend}`);
    if (s.sim_ref && s.st === "pass") facts.push(`${s.sim_ref}似`);
    if (s.sim_ref && s.st === "nobottom" && (s.sim ?? 0) >= 0.85) facts.push(`${s.sim_ref}の上昇前に似てる ${s.sim.toFixed(2)}`);
  }
  return el("button", { class: "item", onclick: () => openDetail(s) },
    el("span", { class: "name", text: s.n }),
    metric,
    el("span", { class: "code", text: `${code(s.t)} ・ ${s.s}` }),
    facts.length ? el("span", { class: "facts" }, ...facts.map((f) => el("span", { text: f }))) : null);
}

/* ---------- 詳細シート ---------- */
function whyText(s) {
  const p = state.data.params || {};
  const near = Math.round((p.near_low ?? 0.3) * 100);
  if (s.st === "nodata") return "株価データが取得できなかった(上場直後・売買停止・コード変更など)。";
  if (s.st === "high") return `5年の値幅のうち下から${pct(s.pos)}の位置。底値圏(下から${near}%以内)より上なので脱落。`;
  if (s.st === "nobottom") {
    const early = s.sim_ref && (s.sim ?? 0) >= 0.85 ? ` ただ、直近60日の形は${s.sim_ref}が大きく上がる前の形に似ている(類似度${s.sim.toFixed(2)})。` : "";
    return nobottomWhy(s, p) + early;
  }
  return passWhy(s);
}

function nobottomWhy(s, p) {
  const minD = p.min_decline ?? 0.15, minR = p.min_rebound ?? 0.1;
  if ((s.dsl ?? 0) === 0) return `底値圏(${pct(s.pos)})だけど、今日が直近3ヶ月の最安値。まだ下げている途中で、底打ちの形になってない。`;
  if ((s.dec ?? 0) < minD) return `底値圏(${pct(s.pos)})にはいるけど、直近3ヶ月の下げが${pct(s.dec)}と小さく、「底」と呼べる形になってない(${Math.round(minD * 100)}%以上の下げが条件)。`;
  if ((s.reb ?? 0) < minR) return `底値圏(${pct(s.pos)})で直近${pct(s.dec)}下げたけど、底からの反発が${pct(s.reb, true)}でまだ弱い(+${Math.round(minR * 100)}%以上が条件)。`;
  return `底をつけてから${s.dsl}営業日しか経ってなくて、まだ判断できない。`;
}

function passWhy(s) {
  return `底値圏(5年位置${pct(s.pos)})で、直近3ヶ月に${pct(s.dec)}下げたあと底から${pct(s.reb, true)}反発。${s.sim_ref ? `直近60日の形は${s.sim_ref}が大きく上がる前の形に一番近い(類似度${(s.sim ?? 0).toFixed(2)})。` : ""}`;
}

      : el("div", { class: "sub", text: "業績データが取れなかった(中小型株はyfinanceに無いことが多い)。決算は株探で確認を。" });

        : el("span", {}, el("span", { class: "d", text: n.d }), n.t)));
    }
    panel.append(el("div", { class: "section" }, el("h4", { text: "直近2週間のニュース" }),

function closeDetail(fromPop) {
  const sheet = $("#sheet");
  if (sheet.hidden) return;
  sheet.hidden = true;
  document.body.style.overflow = "";
  if (!fromPop && history.state?.sheet) history.back();
}
window.addEventListener("popstate", () => closeDetail(true));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });
$("#sheet").addEventListener("click", (e) => { if (e.target.hasAttribute("data-close")) closeDetail(); });

function stat(label, value, hint) {
  return el("div", { class: "stat" }, el("div", { class: "l", text: label }), el("div", { class: "v", text: value }), hint ? el("div", { class: "h", text: hint }) : null);
}

function buildPrompt(s) {
  const e = s.earn || {};
  const earnTxt = !e.has_data ? "データなし" : `トレンド${e.trend}、売上前年比${pct(e.rev_yoy, true)}、${e.metric}前年比${pct(e.profit_yoy, true)}、前四半期比${pct(e.profit_qoq, true)}`;
  const news = (s.news || []).map((n) => `・[${n.d}] ${n.t}`).join("\n") || "なし";
  const refs = (state.data.refs || []).join("・") || "三菱電機・オムロン・キーエンス・ABEJA・円谷フィールズ";
  return `日本株のスクリーニングで引っかかった銘柄について、参考意見がほしい。
自分の「勝ちパターン」は、${refs}のような「長く下げて底打ちしたあと上がっていく」形。この銘柄がそれに当てはまりそうか、良い点と懸念点を簡潔に評価して。最新の決算やニュースも調べて補足して。最終判断は自分でするので参考意見でOK。

銘柄: ${s.n}(${code(s.t)}) / ${s.s}
最新終値: ${yen(s.px)}円
5年株価位置: ${pct(s.pos)}(0%=5年最安値)
直近3ヶ月: ${s.dec != null ? Math.round(s.dec * 100) : "-"}%下落 → 底から${pct(s.reb, true)}反発(底から${s.dsl}営業日)
${s.sim != null ? `勝ちパターン類似度(直近60日の形と、勝ちパターン銘柄が大きく上がる前の形の相関): ${s.sim.toFixed(2)}(一番近い: ${s.sim_ref || "-"})\n` : ""}業績: ${earnTxt}
直近ニュース:
${news}`;
}

// Claude: URLで質問文ごと渡せる / Gemini: URLで渡す公式の方法がないので、コピーして開く(貼り付けて送信)
// 他のAIアプリ: スマホの共有メニューでGemini・ChatGPTなどのアプリに直接テキストを渡す
async function askAI(s, target) {
  const prompt = buildPrompt(s);
  if (target === "share") {
    try { await navigator.share({ title: `${s.n}について`, text: prompt }); } catch (_) { /* キャンセル */ }
    return;
  }
  // awaitすると新しいタブを開く操作がブロックされることがあるので、コピーは待たずに開く
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(prompt).catch(() => {});
  if (target === "gemini") {
    toast("質問文をコピーした。Geminiが開いたら貼り付けて送信してね");
    window.open("https://gemini.google.com/app", "_blank", "noopener");
  } else {
    toast("質問文をコピーした。Claudeが開くよ");
    window.open(`https://claude.ai/new?q=${encodeURIComponent(prompt)}`, "_blank", "noopener");
  }
}

const SIM_SHORT = {
  all: "通常シグナル全部", first_90: "通常×類似90%↑", first_80: "通常×類似80-90%", first_70: "通常×類似70-80%", first_lo: "通常×類似70%未満",
  near_90: "底値圏×類似90%↑ 即買い", near_95: "底値圏×類似95%↑ 即買い", sig_90: "底打ち×類似90%↑", post_90: "旧方式(上昇後の形)90%↑",
};

function simSection(bs, table, f, w) {
  if (!bs) return [];
  const rows = [bs.all, ...bs.first, ...bs.hit];
  const hd = (r, d) => r.hold.find((x) => x.days === d) || {};
  const rl = (r, tp, sl) => r.rules.find((x) => x.tp === tp && x.sl === sl) || {};
  const best = rows.reduce((bi, r, i) => ((hd(r, 60).mean ?? -9) > (hd(rows[bi], 60).mean ?? -9) && r.events >= 100 ? i : bi), 0);
  const y = bs.hit.find((r) => r.key === "near_90");
  return [
    el("h5", { text: "勝ちパターン類似度で買ったら" }),
    el("p", { class: "sub", style: "margin:2px 0 6px", text: `類似度 = 直近${bs.window || 60}日の形が、勝ちパターン銘柄が大きく上がる"前"(底〜底の20日後)の形にどれだけ似ているか。各日その日までの株価だけで計算。` }),
    table(["買い方", "件数", "底から", "60日", "120日", "250日"],
      rows.map((r) => [SIM_SHORT[r.key] || r.label, (r.events || 0).toLocaleString(), f(r.from_low_med),
        `${f(hd(r, 60).mean)}\n${w(hd(r, 60).win)}`, `${f(hd(r, 120).mean)}\n${w(hd(r, 120).win)}`, `${f(hd(r, 250).mean)}\n${w(hd(r, 250).win)}`]), best),
    el("p", { class: "muted", style: "font-size:12px;margin:4px 0 0", text: "上段=平均、下段=勝率。「底から」= 買った時点で直近3ヶ月の最安値から既に何%上がっていたか(小さいほど早く乗れている)。「即買い」は反発を待たずに、形が似た日に買う。" }),
    ...(y && y.by_year.length ? [
      el("h5", { text: "底値圏で類似度90%超え→即買い の年ごと(60日)" }),
      table(["年", "件数", "平均", "勝率"], y.by_year.map((r) => [String(r.year), (r.n || 0).toLocaleString(), f(r.mean), w(r.win)])),
    ] : []),
  ];
}

/* ---------- グラフ(線グラフのみ) ---------- */
function decodeSeries(p) {
  const base = new Date(p.b + "T00:00:00");
  return { xs: p.x.map((d) => new Date(base.getTime() + d * 864e5)), ys: p.y };
}

function chartSection(s) {
  const modes = [["w", "5年"], ["d", "3ヶ月"]];
  if (s.cmp) modes.push(["cmp", "勝ちパターンと比較"]);
  let mode = recall("chartMode", "w");
  if (!modes.some(([m]) => m === mode)) mode = "w";
  const seg = el("div", { class: "seg", role: "group", "aria-label": "グラフの期間" });
  const card = el("div", { class: "chart-card" });
  const draw = () => {
    for (const b of seg.children) b.setAttribute("aria-pressed", String(b.dataset.m === mode));
    card.replaceChildren();
    requestAnimationFrame(() => renderChart(card, s, mode));
  };
  for (const [m, label] of modes) {
    seg.append(el("button", { "data-m": m, onclick: () => { mode = m; store("chartMode", m); draw(); } }, label));
  }
  const sec = el("div", { class: "section" }, el("h4", { text: "チャート" }), seg, card);
  setTimeout(draw, 0);
  return sec;
}

function renderChart(card, s, mode) {
  const p = state.data.params || {};
  if (mode === "cmp" && s.cmp.b_at) {
    // 新方式: 今日=100。勝ちパターンは"同じ形だった日"を今日に重ね、その後の動き(点線)まで表示
    const a = s.cmp.a, b = s.cmp.b;
    const n = a.length;
    const series = [
      { name: s.n, xs: a.map((_, i) => i - n + 1), ys: a, color: "var(--s1)" },
      { name: s.sim_ref || "勝ちパターン", xs: b.map((_, i) => i - n + 1), ys: b, color: "var(--s2)", dashFrom: n - 1 },
    ];
    card.append(el("div", { class: "chart-title" },
      el("span", { text: "今日=100。点線は勝ちパターンのその後" }),
      el("span", { class: "legend" }, ...series.map((sr) => el("span", {}, el("i", { style: `background:${sr.color}` }), sr.name)))));
    const after = b.length > n ? b[b.length - 1] - 100 : null;
    lineChart(card, { series, xKind: "rel", baseline: 100, vline: { x: 0, label: "今日" }, yFmt: (v) => v.toFixed(0), valFmt: (v) => v.toFixed(1),
      note: `${s.sim_ref}の${s.cmp.b_at.replace(/-/g, "/")}(底の${s.cmp.k}営業日後)と形が似ている${after != null ? `。そこから${b.length - n}営業日で${after > 0 ? "+" : ""}${after.toFixed(0)}%` : ""}` });
    return;
  }
  if (mode === "cmp") {
    const a = s.cmp.a, b = s.cmp.b;
    const series = [
      { name: s.n, xs: a.map((_, i) => i), ys: a, color: "var(--s1)" },
      { name: s.sim_ref || "勝ちパターン", xs: b.map((_, i) => i), ys: b, color: "var(--s2)" },
    ];
    card.append(el("div", { class: "chart-title" },
      el("span", { text: "底の日=100として、そこからの動き" }),
      el("span", { class: "legend" }, ...series.map((sr) => el("span", {}, el("i", { style: `background:${sr.color}` }), sr.name)))));
    lineChart(card, { series, xKind: "day", baseline: 100, yFmt: (v) => v.toFixed(0), valFmt: (v) => v.toFixed(1),
      note: s.cmp.b_from ? `${s.sim_ref}は${s.cmp.b_from.replace(/-/g, "/")}の底から` : null });
    return;
  }
  const { xs, ys } = decodeSeries(s.ch[mode]);
  const series = [{ name: s.n, xs, ys, color: "var(--s1)" }];
  card.append(el("div", { class: "chart-title" }, el("span", { text: mode === "w" ? "終値(週足・5年)" : "終値(日足・3ヶ月)" })));
  const lo = Math.min(...ys), hi = Math.max(...ys);
  const opts = { series, xKind: "date", span: mode, yFmt: yen, valFmt: (v) => `${yen(v)}円` };
  if (mode === "w") opts.hline = { y: lo + (hi - lo) * (p.near_low ?? 0.3), label: "底値圏ライン" };
  if (mode === "d" && s.low_d) {
    const t = new Date(s.low_d + "T00:00:00").getTime();
    let bi = 0, bd = Infinity;
    xs.forEach((x, i) => { const dd = Math.abs(x.getTime() - t); if (dd < bd) { bd = dd; bi = i; } });
    opts.mark = { i: bi, label: "底" };
  }
  lineChart(card, opts);
}

function niceTicks(lo, hi, n = 4) {
  const span = hi - lo || Math.abs(hi) || 1;
  const raw = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((st) => st >= raw) || 10 * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

function lineChart(host, o) {
  const wrap = el("div", { class: "chart" });
  host.append(wrap);
  const W = Math.max(280, wrap.clientWidth || host.clientWidth - 20);
  const H = 220;
  const m = { l: 50, r: 16, t: 14, b: 28 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const allX = o.series.flatMap((sr) => sr.xs.map((x) => (x instanceof Date ? x.getTime() : x)));
  const allY = o.series.flatMap((sr) => sr.ys);
  if (o.baseline != null) allY.push(o.baseline);
  if (o.hline) allY.push(o.hline.y);
  const x0 = Math.min(...allX), x1 = Math.max(...allX);
  let y0 = Math.min(...allY), y1 = Math.max(...allY);
  const pad = (y1 - y0) * 0.08 || 1;
  y0 -= pad; y1 += pad;
  const X = (x) => m.l + ((x instanceof Date ? x.getTime() : x) - x0) / (x1 - x0 || 1) * iw;
  const Y = (y) => m.t + (1 - (y - y0) / (y1 - y0 || 1)) * ih;

  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": o.series.map((s) => s.name).join("と") + "の推移" });
  const g = sv("g", {});
  svg.append(g);

  // grid + y ticks
  for (const t of niceTicks(y0, y1, 4)) {
    g.append(sv("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: "var(--grid)", "stroke-width": 1 }));
    const tx = sv("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)", style: "font-variant-numeric:tabular-nums" });
    tx.textContent = o.yFmt(t);
    g.append(tx);
  }
  // x ticks
  const xt = [];
  if (o.xKind === "date") {
    const d0 = new Date(x0), d1 = new Date(x1);
    if (o.span === "w") {
      for (let y = d0.getFullYear() + 1; y <= d1.getFullYear(); y++) xt.push([new Date(y, 0, 1).getTime(), `${y}`]);
    } else {
      const c = new Date(d0.getFullYear(), d0.getMonth() + 1, 1);
      while (c.getTime() <= x1) { xt.push([c.getTime(), `${c.getMonth() + 1}月`]); c.setMonth(c.getMonth() + 1); }
    }
  } else if (o.xKind === "rel") {
    for (let d = Math.ceil(x0 / 20) * 20; d <= x1; d += 20) xt.push([d, d === 0 ? "今日" : d < 0 ? `${-d}日前` : `${d}日後`]);
  } else {
    for (let d = 0; d <= x1; d += 10) xt.push([d, d === 0 ? "底" : `${d}日後`]);
  }
  g.append(sv("line", { x1: m.l, x2: W - m.r, y1: m.t + ih, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1 }));
  for (const [v, label] of xt) {
    const x = m.l + (v - x0) / (x1 - x0 || 1) * iw;
    if (x < m.l - 1 || x > W - m.r + 1) continue;
    const tx = sv("text", { x, y: H - 8, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
    tx.textContent = label;
    g.append(tx);
  }
  if (o.baseline != null) g.append(sv("line", { x1: m.l, x2: W - m.r, y1: Y(o.baseline), y2: Y(o.baseline), stroke: "var(--axis)", "stroke-width": 1 }));
  if (o.hline) {
    g.append(sv("rect", { x: m.l, y: Y(o.hline.y), width: iw, height: Math.max(0, m.t + ih - Y(o.hline.y)), fill: "var(--s1)", "fill-opacity": 0.07 }));
    g.append(sv("line", { x1: m.l, x2: W - m.r, y1: Y(o.hline.y), y2: Y(o.hline.y), stroke: "var(--axis)", "stroke-width": 1 }));
    const tx = sv("text", { x: m.l + 6, y: Y(o.hline.y) - 5, "font-size": 11, fill: "var(--ink2)" });
    tx.textContent = o.hline.label;
    g.append(tx);
  }

  // lines
  if (o.vline) {
    g.append(sv("line", { x1: X(o.vline.x), x2: X(o.vline.x), y1: m.t, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1, "stroke-dasharray": "3 3" }));
  }
  for (const sr of o.series) {
    const pth = (from, to) => sr.xs.slice(from, to).map((x, j) => `${j ? "L" : "M"}${X(x).toFixed(1)},${Y(sr.ys[from + j]).toFixed(1)}`).join("");
    const cut = sr.dashFrom != null && sr.dashFrom < sr.xs.length - 1 ? sr.dashFrom : sr.xs.length - 1;
    g.append(sv("path", { d: pth(0, cut + 1), fill: "none", stroke: sr.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    if (cut < sr.xs.length - 1) {
      g.append(sv("path", { d: pth(cut, sr.xs.length), fill: "none", stroke: sr.color, "stroke-width": 2, "stroke-dasharray": "4 4", "stroke-linecap": "round", opacity: 0.8 }));
    }
    const li = sr.xs.length - 1;
    g.append(sv("circle", { cx: X(sr.xs[li]), cy: Y(sr.ys[li]), r: 4, fill: sr.color, stroke: "var(--surface)", "stroke-width": 2 }));
  }
  if (o.mark) {
    const sr = o.series[0];
    const cx = X(sr.xs[o.mark.i]), cy = Y(sr.ys[o.mark.i]);
    g.append(sv("circle", { cx, cy, r: 5, fill: "var(--surface)", stroke: sr.color, "stroke-width": 2 }));
    const tx = sv("text", { x: cx, y: cy + 18, "text-anchor": "middle", "font-size": 11, "font-weight": 700, fill: "var(--ink2)" });
    tx.textContent = o.mark.label;
    g.append(tx);
  }

  // crosshair + tooltip
  const cross = sv("line", { y1: m.t, y2: m.t + ih, stroke: "var(--ink2)", "stroke-width": 1, visibility: "hidden" });
  const dots = o.series.map((sr) => sv("circle", { r: 4, fill: sr.color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }));
  svg.append(cross, ...dots);
  const hit = sv("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "transparent", tabindex: 0 });
  svg.append(hit);
  wrap.append(svg);
  const tip = el("div", { class: "tip", hidden: true });
  wrap.append(tip);

  const ref = o.series.reduce((a, b) => (b.xs.length > a.xs.length ? b : a)); // 一番長い系列でX位置を拾う
  let cur = -1;
  function show(i) {
    i = Math.max(0, Math.min(ref.xs.length - 1, i));
    cur = i;
    const x = X(ref.xs[i]);
    cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
    o.series.forEach((sr, k) => {
      if (i < sr.ys.length) {
        dots[k].setAttribute("cx", X(sr.xs[i])); dots[k].setAttribute("cy", Y(sr.ys[i])); dots[k].setAttribute("visibility", "visible");
      } else dots[k].setAttribute("visibility", "hidden");
    });
    const xv = ref.xs[i];
    const head = xv instanceof Date ? `${xv.getFullYear()}/${xv.getMonth() + 1}/${xv.getDate()}`
      : o.xKind === "rel" ? (xv === 0 ? "今日" : xv < 0 ? `${-xv}営業日前` : `${xv}営業日後(勝ちパターンのその後)`)
      : xv === 0 ? "底の日" : `底から${xv}日後`;
    tip.replaceChildren(el("div", { text: head }),
      ...o.series.filter((sr) => i < sr.ys.length).map((sr) => el("div", { class: "r" }, el("i", { style: `background:${sr.color}` }), el("b", { text: o.valFmt(sr.ys[i]) }), o.series.length > 1 ? sr.name : null)));
    tip.hidden = false;
    const scale = wrap.clientWidth / W;
    const px = x * scale;
    const tw = tip.offsetWidth;
    tip.style.left = `${Math.min(Math.max(0, px - tw / 2), wrap.clientWidth - tw)}px`;
    tip.style.top = "0px";
  }
  function hide() { cross.setAttribute("visibility", "hidden"); dots.forEach((d) => d.setAttribute("visibility", "hidden")); tip.hidden = true; cur = -1; }
  function idxAt(clientX) {
    const r = svg.getBoundingClientRect();
    const vx = (clientX - r.left) * (W / r.width);
    let best = 0, bd = Infinity;
    ref.xs.forEach((x, i) => { const d = Math.abs(X(x) - vx); if (d < bd) { bd = d; best = i; } });
    return best;
  }
  hit.addEventListener("pointerdown", (e) => show(idxAt(e.clientX)));
  hit.addEventListener("pointermove", (e) => show(idxAt(e.clientX)));
  hit.addEventListener("pointerleave", hide);
  hit.addEventListener("pointercancel", hide);
  hit.addEventListener("focus", () => { if (cur < 0) show(ref.xs.length - 1); });
  hit.addEventListener("blur", hide);
  hit.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { show((cur < 0 ? ref.xs.length : cur) - 1); e.preventDefault(); }
    if (e.key === "ArrowRight") { show((cur < 0 ? -1 : cur) + 1); e.preventDefault(); }
  });
  if (o.note) host.append(el("div", { class: "chart-title", style: "padding-top:4px" }, el("span", { class: "muted", text: o.note })));
}

/* ---------- デモデータ(架空) ---------- */
function makeDemo() {
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const genres = { "テクノロジー": ["半導体", "FA(ファクトリーオートメーション)", "AI"], "インフラ・防衛": ["防衛", "宇宙"], "消費・生活": ["インバウンド・観光"], "エネルギー・資源": ["再生可能エネルギー"], "金融・商社": ["総合商社"] };
  const sectors = ["機械", "電気機器", "精密機器", "化学", "情報・通信業", "サービス業", "卸売業", "小売業", "輸送用機器", "医薬品"];
  const themes = Object.values(genres).flat();
  const end = new Date(); end.setHours(0, 0, 0, 0);
  const days = 1230;
  const stocks = [];
  for (let k = 0; k < 160; k++) {
    const kind = k < 9 ? "pass" : k < 30 ? "nobottom" : k < 150 ? "high" : "nodata";
    const name = `デモ銘柄${String(k + 1).padStart(3, "0")}`;
    const t = `${9000 + k}.T`;
    const s = sectors[k % sectors.length];
    const th = k % 3 === 0 ? [themes[k % themes.length]] : [];
    if (kind === "nodata") { stocks.push({ t, n: name, s, th, st: kind }); continue; }
    const ys = []; let v = 800 + rnd() * 3000;
    for (let i = 0; i < days; i++) {
      v *= Math.exp(gauss() * 0.013 + (kind === "high" ? 0.0006 : 0.0002));
      ys.push(v);
    }
    if (kind !== "high") {
      const top = Math.max(...ys.slice(0, days - 70)) * (0.9 + rnd() * 0.1);
      for (let i = days - 400; i < days - 60; i++) ys[i] = top * (1 - 0.35 * (i - (days - 400)) / 340) * Math.exp(gauss() * 0.01);
      const lowV = ys[days - 61] * (kind === "pass" ? 0.78 : 0.93);
      for (let i = days - 60; i < days - 35; i++) ys[i] = ys[days - 61] + (lowV - ys[days - 61]) * (i - (days - 60)) / 25 * (1 + gauss() * 0.01);
      const up = kind === "pass" ? 1.12 + rnd() * 0.15 : 1.03;
      for (let i = days - 35; i < days; i++) ys[i] = lowV * (1 + (up - 1) * (i - (days - 35)) / 35) * Math.exp(gauss() * 0.008);
    }
    const dates = []; for (let i = 0; i < days; i++) dates.push(new Date(end.getTime() - (days - 1 - i) * 1.4 * 864e5));
    const lo = Math.min(...ys), hi = Math.max(...ys), px = ys[days - 1];
    const win = ys.slice(-63); const li = win.indexOf(Math.min(...win));
    const pre = Math.max(...win.slice(0, li + 1));
    const rec = { t, n: name, s, th, px: +px.toPrecision(5), pos: +((px - lo) / (hi - lo)).toFixed(3), yrs: 4.9,
      dec: +((pre - win[li]) / pre).toFixed(3), reb: +((px - win[li]) / win[li]).toFixed(3), dsl: 62 - li, st: kind };
    if (kind === "nobottom") {
      rec.sim = +(0.5 + rnd() * 0.45).toFixed(3); rec.sim_ref = ["三菱電機", "オムロン", "キーエンス"][k % 3];
    }
    if (kind === "pass") {
      rec.pos = Math.min(rec.pos, 0.28);
      const enc = (idx) => { const b = dates[idx[0]]; return { b: b.toISOString().slice(0, 10), x: idx.map((i) => Math.round((dates[i] - b) / 864e5)), y: idx.map((i) => +ys[i].toPrecision(4)) }; };
      const weekly = []; for (let i = 0; i < days; i += 5) weekly.push(i); weekly.push(days - 1);
      const daily = []; for (let i = days - 63; i < days; i++) daily.push(i);
      rec.ch = { w: enc(weekly), d: enc(daily) };
      rec.low_d = dates[days - 63 + li].toISOString().slice(0, 10);
      const a = ys.slice(-60).map((y) => +(y / px * 100).toFixed(1));
      const b = a.map((y) => +(100 + (y - 100) * (0.8 + 0.3 * rnd())).toFixed(1))
        .concat(Array.from({ length: 60 }, (_, i) => +(100 + (i + 1) * (0.3 + 0.4 * rnd())).toFixed(1)));
      const refs = ["三菱電機", "オムロン", "キーエンス", "ABEJA", "円谷フィールズ"];
      rec.sim = +(0.75 + rnd() * 0.23).toFixed(3); rec.sim_ref = refs[k % refs.length];
      rec.cmp = { a, b, b_at: "2023-11-08", k: 8 };
      rec.earn = k % 3 === 2 ? { has_data: false, trend: "データ不足" } : { has_data: true, trend: k % 2 ? "改善" : "横ばい", metric: "営業利益", rev_yoy: 0.08, profit_yoy: k % 2 ? 0.21 : -0.02, profit_qoq: 0.05 };
      rec.news = [{ d: "09/20", t: "(デモ)架空のニュース見出しがここに並びます", u: "" }];
      if (k < 3) rec.ai = { score: +(0.8 - k * 0.07).toFixed(2), comment: "(デモ)AI評価のコメントがここに出ます。良い点と懸念点を2〜3文で。" };
    }
    stocks.push(rec);
  }
  return { generated_at: new Date().toISOString(), universe_count: stocks.length, params: { near_low: 0.3, min_decline: 0.15, min_rebound: 0.1 },
    genres, sectors, refs: ["三菱電機", "オムロン", "キーエンス", "ABEJA", "円谷フィールズ"], stocks };
}
