  panel.append(el("div", { class: "genre" }, el("div", { class: "genre-label", text: "業種(東証33業種)" }), secChips));
  panel.append(el("div", { class: "fsheet-foot" },
    el("span", { class: "selection-line", id: "f-count", style: "flex:1" }),
    el("button", { class: "btn primary", onclick: () => closeFilter() }, "結果を見る")));
}
function openFilter() {
  $("#fsheet").hidden = false;
  document.body.style.overflow = "hidden";
  $("#fpanel").scrollTop = 0;
  if (!history.state?.fsheet) history.pushState({ fsheet: true }, "");
}
function closeFilter(fromPop) {
  const sh = $("#fsheet");
  if (sh.hidden) return;
  sh.hidden = true;
  document.body.style.overflow = "";
  if (!fromPop && history.state?.fsheet) history.back();
}
$("#fsheet").addEventListener("click", (e) => { if (e.target.hasAttribute("data-fclose")) closeFilter(); });
window.addEventListener("popstate", () => closeFilter(true));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeFilter(); });

function renderFilterBar(poolLen) {
  const bar = $("#filterbar");
  if (!bar) return;
  const n = state.themes.size + state.sectors.size;
  const fb = el("button", { class: "fbtn", onclick: openFilter, "aria-label": `テーマ・業種で絞り込む${n ? `(${n}件選択中)` : ""}` },
    el("span", { html: "" }), "絞り込み", el("span", { class: "count", hidden: !n, text: String(n) }));
  fb.firstChild.replaceWith((() => { const x = sv("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": 2.2, "stroke-linecap": "round" }); x.append(sv("path", { d: "M4 6h16M7 12h10M10 18h4" })); return x; })());
  const kids = [fb];
  for (const [set, kind] of [[state.themes, "theme"], [state.sectors, "sector"]]) {
    for (const name of set) {
      kids.push(el("button", { class: "achip", "aria-label": `${name}を解除`, onclick: () => { set.delete(name); persistSel(); state.shown = PAGE; render(); } }, name, el("i", { text: "✕" })));
    }
  }
  if (!n) kids.push(el("span", { class: "fhint", text: `テーマ・業種を選ぶ(未選択=全${poolLen.toLocaleString()}銘柄)` }));
  bar.replaceChildren(...kids);
}

function chip(name, kind, n) {
  const set = kind === "theme" ? state.themes : state.sectors;
  const b = el("button", { class: n ? "chip" : "chip zero", "aria-pressed": String(set.has(name)), "data-kind": kind, "data-name": name },
    el("span", { class: "box", "aria-hidden": "true" }), name, el("span", { class: "n", text: n ? String(n) : "0" }));
  b.addEventListener("click", () => {
    set.has(name) ? set.delete(name) : set.add(name);
    b.setAttribute("aria-pressed", String(set.has(name)));
    persistSel();
    state.shown = PAGE;
    render();
  });
  return b;
}
function persistSel() { store("themes", [...state.themes]); store("sectors", [...state.sectors]); }

function themeCounts() {
  const themes = {}, sectors = {};
  for (const s of state.data.stocks) {
    for (const t of s.th || []) themes[t] = (themes[t] || 0) + 1;
    sectors[s.s] = (sectors[s.s] || 0) + 1;
  }
  return { themes, sectors };
}

/* ---------- 絞り込みロジック(STEP1はここで端末内処理) ---------- */
function selected() {
  const all = state.data.stocks;
  if (!state.themes.size && !state.sectors.size) return all;
  return all.filter((s) => state.sectors.has(s.s) || (s.th || []).some((t) => state.themes.has(t)));
}

function render() {
  const pool = selected();
  for (const c of document.querySelectorAll(".chip")) {
    const set = c.dataset.kind === "theme" ? state.themes : state.sectors;
    c.setAttribute("aria-pressed", String(set.has(c.dataset.name)));
  }
  $("#clear").disabled = !state.themes.size && !state.sectors.size;
  const nSel = state.themes.size + state.sectors.size;
  $("#sel-line").textContent = nSel ? `${nSel}件で絞り込み中` : "全銘柄";
  const nPass = pool.filter((x) => x.st === "pass").length;
  $("#f-count").textContent = `${pool.length.toLocaleString()}銘柄 → 候補 ${nPass}`;
  renderFilterBar(pool.length);

  const by = { pass: 0, nobottom: 0, high: 0, nodata: 0 };
  for (const s of pool) by[s.st] = (by[s.st] || 0) + 1;
  const stages = [
    { label: "対象", n: pool.length, tab: null, color: "--f1" },
    { label: "株価あり", n: pool.length - by.nodata, drop: by.nodata, tab: "nodata", color: "--f2" },
    { label: "底値圏", n: by.nobottom + by.pass, drop: by.high, tab: "high", color: "--f3" },
    { label: "底打ち=候補", n: by.pass, drop: by.nobottom, tab: "pass", dropTab: "nobottom", color: "--f4" },
  ];
  const f = $("#funnel");
  f.replaceChildren();
  const max = Math.max(1, stages[0].n);
  stages.forEach((st, i) => {
    // 最後の段(候補)だけタップで候補一覧へ。途中の段は「脱落した銘柄」の行から各一覧へ飛べる。
    const isLast = i === stages.length - 1;
    const parts = [
      el("span", { class: "f-label", text: st.label }),
      el("span", { class: "f-track" }, el("span", { class: "f-bar", style: `display:block;width:${(st.n / max) * 100}%;background:var(${st.color})` })),
      el("span", { class: "f-num", text: st.n.toLocaleString() }),
    ];
    f.append(isLast
      ? el("button", { class: "f-row", "aria-current": String(state.tab === "pass"), "aria-label": `候補 ${st.n}銘柄を見る`, onclick: () => setTab("pass", true) }, ...parts)
      : el("div", { class: "f-row" }, ...parts));
    if (i > 0 && st.drop) {
      const dropTab = st.dropTab || st.tab;
      const reason = { nodata: "データなし", high: "底値圏より上", nobottom: "底打ちしてない" }[dropTab];
      f.append(el("div", { class: "f-drop" },
        el("button", { class: "btn-text", style: "font-size:12px;padding:0", onclick: () => setTab(dropTab, true) }, `↳ ${st.drop.toLocaleString()}銘柄が脱落(${reason})`)));
    }
  });

  for (const b of document.querySelectorAll(".tab")) {
    b.setAttribute("aria-selected", String(b.dataset.st === state.tab));
    b.querySelector(".n").textContent = (by[b.dataset.st] || 0).toLocaleString();
  }
  renderList(pool);
  renderVol(pool);
  renderEv(pool);
  renderDiv(pool);
}

function setTab(st, scroll) {
  state.tab = st;
  state.shown = PAGE;
  store("tab", st);
  syncSort();
  render();
  if (scroll) $("#list-sec").scrollIntoView({ behavior: "smooth", block: "start" });
}

function syncSort() {
  const sel = $("#sort");
  if (!sel) return;
  const opts = state.tab === "pass"
    ? [["best", "おすすめ順"], ["sim", "類似度が高い順"], ["reb", "反発が大きい順"], ["pos", "株価位置が低い順"]]
    : state.tab === "nobottom"
      ? [["sim", "類似度が高い順"], ["pos", "株価位置が低い順"], ["reb", "反発が大きい順"], ["name", "コード順"]]
      : [["pos", "株価位置が低い順"], ["reb", "反発が大きい順"], ["name", "コード順"]];
  if (!opts.some(([v]) => v === state.sort)) state.sort = opts[0][0];
  sel.replaceChildren(...opts.map(([v, l]) => el("option", { value: v, text: l })));
  sel.value = state.sort;
}

function sortStocks(list) {
  const k = state.sort;
  const num = (v, fb) => (v == null ? fb : v);
  const cmp = {
    best: (a, b) => isBest(b) - isBest(a) || num(b.ai?.score, -1) - num(a.ai?.score, -1) || num(b.sim, 0) - num(a.sim, 0),
    sim: (a, b) => num(b.sim, 0) - num(a.sim, 0),
    reb: (a, b) => num(b.reb, -9) - num(a.reb, -9),
    pos: (a, b) => num(a.pos, 9) - num(b.pos, 9),
    name: (a, b) => a.t.localeCompare(b.t),
  }[k];
  return list.slice().sort(cmp);
}

function renderList(pool = selected()) {
  const q = state.q.toLowerCase();
  let list = pool.filter((s) => s.st === state.tab);
  if (q) list = list.filter((s) => s.n.toLowerCase().includes(q) || s.t.toLowerCase().includes(q));
  list = sortStocks(list);

  const notes = {
    pass: "底値圏にいて、直近で底打ちした銘柄。★=過去の統計で成績が一番良かった条件(類似度0.90以上)。",
    nobottom: "底値圏にはいるけど、まだ底打ちの形になってない銘柄。類似度が高いものは「反発前の早い段階」の可能性。",
    high: "5年の値幅の中で、まだ底値圏まで下がってない銘柄。",
    nodata: "株価が取れなかった銘柄(上場直後・売買停止など)。",
  };
  $("#tab-note").textContent = notes[state.tab];

  const ul = $("#list");
  ul.replaceChildren();
  if (!list.length) {
    ul.append(el("li", { class: "empty", text: q ? "検索に一致する銘柄なし" : state.tab === "pass" ? "今日は候補なし。テーマを増やすか、全銘柄で見てみて。" : "該当なし" }));
  }
  const ranked = state.sort !== "name";
  list.slice(0, state.shown).forEach((s, i) => ul.append(el("li", {}, row(s, ranked ? i + 1 : 0))));
  const slot = $("#more-slot");
  slot.replaceChildren();
  if (list.length > state.shown) {
    slot.append(el("button", { class: "more", onclick: () => { state.shown += PAGE; renderList(); } },
      `もっと見る(残り${(list.length - state.shown).toLocaleString()}件)`));
  }
}

// 過去の統計で一番成績が良かった条件(底打ち候補 × 上がる前の形の類似度0.90以上)
const BEST_SIM = 0.9;
function isBest(s) { return s.st === "pass" && (s.sim ?? 0) >= BEST_SIM ? 1 : 0; }

// 並び順に使っている値を、右側の大きい数字として表示する(並び順が一目でわかるように)
const SORT_METRIC = {
  sim: (s) => [s.sim != null ? s.sim.toFixed(2) : "-", "類似度 ▼"],
  pos: (s) => [pct(s.pos), "5年位置 ▲"],
  reb: (s) => [pct(s.reb, true), "底からの反発 ▼"],
};

function row(s, rank) {
  let val, label, key = false;
  const k = state.sort;
  if (s.st === "nodata") {
    val = "-"; label = "";
  } else if (SORT_METRIC[k]) {
    [val, label] = SORT_METRIC[k](s); key = true;
  } else if (k === "best" && s.st === "pass") {
    [val, label] = s.ai ? [s.ai.score.toFixed(2), "AIスコア ▼"] : [(s.sim ?? 0).toFixed(2), "類似度 ▼"]; key = true;
  } else if (s.st === "pass") {
    [val, label] = [(s.sim ?? 0).toFixed(2), "類似度"];
  } else {
    [val, label] = [pct(s.pos), "5年位置"];
  }
  const metric = el("span", { class: key ? "metric key" : "metric" }, el("b", { text: val }), label ? el("small", { text: label }) : null);
  const facts = [];
  if (isBest(s)) facts.push({ star: true, t: "★ ベスト条件" });
  if (s.st !== "nodata") {
    if (k !== "pos") facts.push(`5年位置 ${pct(s.pos)}`);
    facts.push(`3ヶ月 ${s.dec != null ? "-" + Math.round(s.dec * 100) + "%" : "-"}→底から${pct(s.reb, true)}`);
    if (s.earn) facts.push(`業績 ${s.earn.trend}`);
    if (s.dv?.y) facts.push(`配当 ${fmtY(s.dv.y)}`);
    if (s.sim_ref && s.st === "pass") facts.push(`${s.sim_ref}似`);
    if (s.sim_ref && s.st === "nobottom" && (s.sim ?? 0) >= 0.85) facts.push(`${s.sim_ref}の上昇前に似てる`);
    if (k !== "sim" && k !== "best" && s.sim != null && s.st === "nobottom") facts.push(`類似度 ${s.sim.toFixed(2)}`);
  }
  return el("button", { class: isBest(s) ? "item best" : "item", onclick: () => openDetail(s) },
    el("span", { class: "name" }, rank ? el("span", { class: "rank-no", text: String(rank) }) : null, s.n),
    metric,
    el("span", { class: "code", text: `${code(s.t)} ・ ${s.s}` }),
    facts.length ? el("span", { class: "facts" }, ...facts.map((f) => (typeof f === "string" ? el("span", { text: f }) : el("span", { class: "star", text: f.t })))) : null);
}

/* ---------- 詳細シート ---------- */
function whyText(s) {
  const p = state.data.params || {};
  const near = Math.round((p.near_low ?? 0.3) * 100);
  if (s.st === "nodata") return "株価データが取得できなかった(上場直後・売買停止・コード変更など)。";
  if (s.st === "high") return `5年の値幅のうち下から${pct(s.pos)}の位置。底値圏(下から${near}%以内)より上なので脱落。`;
  if (s.st === "nobottom") {
    const early = s.sim_ref && (s.sim ?? 0) >= 0.85 ? ` ただ、直近60日の形は${s.sim_ref}が大きく上がる前の形に似ている(類似度${s.sim.toFixed(2)})。` : "";
    return nobottomWhy(s, p) + early;
  }
  return passWhy(s);
}

function nobottomWhy(s, p) {
  const minD = p.min_decline ?? 0.15, minR = p.min_rebound ?? 0.1;
  if ((s.dsl ?? 0) === 0) return `底値圏(${pct(s.pos)})だけど、今日が直近3ヶ月の最安値。まだ下げている途中で、底打ちの形になってない。`;
  if ((s.dec ?? 0) < minD) return `底値圏(${pct(s.pos)})にはいるけど、直近3ヶ月の下げが${pct(s.dec)}と小さく、「底」と呼べる形になってない(${Math.round(minD * 100)}%以上の下げが条件)。`;
  if ((s.reb ?? 0) < minR) return `底値圏(${pct(s.pos)})で直近${pct(s.dec)}下げたけど、底からの反発が${pct(s.reb, true)}でまだ弱い(+${Math.round(minR * 100)}%以上が条件)。`;
  return `底をつけてから${s.dsl}営業日しか経ってなくて、まだ判断できない。`;
}

function passWhy(s) {
  return `底値圏(5年位置${pct(s.pos)})で、直近3ヶ月に${pct(s.dec)}下げたあと底から${pct(s.reb, true)}反発。${s.sim_ref ? `直近60日の形は${s.sim_ref}が大きく上がる前の形に一番近い(類似度${(s.sim ?? 0).toFixed(2)})。` : ""}`;
}

function openDetail(s, ctx = null) {
  const panel = $("#panel");
  panel.replaceChildren();
  panel.scrollTop = 0;
  const closeBtn = el("button", { class: "close", onclick: () => closeDetail() }, "閉じる");
  panel.append(el("div", { class: "sheet-top" }, el("span", { class: "grab", "aria-hidden": "true" }),
    ctx === "vol" ? el("span", { class: "pill pass", text: "出来高急増" })
      : ctx === "ev" ? el("span", { class: "pill pass", text: "イベント" })
        : ctx === "div" ? el("span", { class: "pill pass", text: "配当" })
        : el("span", { class: s.st === "pass" ? "pill pass" : "pill", text: STATUS[s.st].label }), closeBtn));

  panel.append(el("div", { class: "d-head" },
    el("h3", { id: "d-title", text: s.n }),
    el("div", { class: "code", text: `${code(s.t)} ・ ${s.s}${(s.th || []).length ? " ・ " + s.th.join("・") : ""}` }),
    s.px != null ? el("div", { class: "price" }, el("b", { text: `${yen(s.px)}円` }), el("span", { class: "sub", text: "最新終値" })) : null),
    el("div", { class: "why", text: ctx === "vol" && s.vs ? volWhy(s) : ctx === "ev" ? evWhy(s) : ctx === "div" && s.dv ? divWhy(s) : whyText(s) }));
  if (ctx) panel.append(el("div", { class: "why", style: "margin-top:8px;font-size:13px", text: `底打ちの見方では: ${whyText(s)}` }));

  if (s.ch) panel.append(chartSection(s));
  else if (s.st !== "nodata") {
    // 候補以外の銘柄のチャートは、開いた時に銘柄ごとのファイルを読み込む
    const ph = el("div", { class: "section" }, el("h4", { text: "チャート" }), el("div", { class: "chart-card sub", style: "padding:24px;text-align:center", text: "チャートを読み込み中…" }));
    panel.append(ph);
    loadChart(s).then((ok) => {
      if (!ph.isConnected) return;
      if (ok) ph.replaceWith(chartSection(s));
      else ph.lastChild.textContent = "チャートを読み込めませんでした(次回の自動計算後に見られるようになります)";
    });
  }

  if (s.st !== "nodata") {
    const stats = el("div", { class: "stats" },
      stat("5年位置", pct(s.pos), s.yrs != null && s.yrs < 3 ? `データ${s.yrs}年分のみ` : "0%=5年最安値"),
      stat("3ヶ月の下落", s.dec != null ? `-${Math.round(s.dec * 100)}%` : "-", "底までの下げ幅"),
      stat("底からの反発", pct(s.reb, true), `底から${s.dsl ?? "-"}営業日`),
      s.sim != null ? stat("勝ちパターン類似度", s.sim.toFixed(2), s.sim_ref ? `${s.sim_ref}の上昇前に近い` : "比較対象なし") : null);
    panel.append(el("div", { class: "section" }, el("h4", { text: "数字" }), stats));
  }

  if (s.dv) panel.append(divSection(s));
  else if (s.st !== "nodata") panel.append(el("div", { class: "section" }, el("h4", { text: "配当" }),
    el("div", { class: "box sub", text: "配当なし(直近1年以上、配当の記録がない)。成長重視で配当を出していない会社か、データが取れていない可能性がある。" })));
  if (s.st === "pass" && s.px != null && !ctx) panel.append(planSection(s));
  if (ctx === "vol" && s.vs) panel.append(volPlan(s));

  if (s.ai) {
    panel.append(el("div", { class: "section" }, el("h4", { text: "AI評価" }),
      el("div", { class: "box" }, el("div", { class: "ai-score", text: s.ai.score.toFixed(2) }), el("div", { text: s.ai.comment }))));
  }

  if (s.earn) {
    const e = s.earn;
    const body = e.has_data
      ? el("div", {},
        el("div", {}, el("b", { text: `業績トレンド: ${e.trend}` })),
        el("div", { class: "sub", text: [
          e.rev_yoy != null ? `売上 前年比 ${pct(e.rev_yoy, true)}` : null,
          e.profit_yoy != null ? `${e.metric} 前年比 ${pct(e.profit_yoy, true)}` : null,
          e.profit_qoq != null ? `${e.metric} 前四半期比 ${pct(e.profit_qoq, true)}` : null,
        ].filter(Boolean).join(" ・ ") || "伸び率は計算できず" }))
      : el("div", { class: "sub", text: "業績データが取れなかった(中小型株はyfinanceに無いことが多い)。決算は株探で確認を。" });
    panel.append(el("div", { class: "section" }, el("h4", { text: "業績" }), el("div", { class: "box" }, body)));
  }

  if (s.news) {
    const ul = el("ul", { class: "news" });
    for (const n of s.news) {
      const u = safeUrl(n.u);
      ul.append(el("li", {}, u ? el("a", { href: u, target: "_blank", rel: "noopener" }, el("span", { class: "d", text: n.d }), n.t)
        : el("span", {}, el("span", { class: "d", text: n.d }), n.t)));
    }
    panel.append(el("div", { class: "section" }, el("h4", { text: "直近2週間のニュース" }),
      el("div", { class: "box" }, s.news.length ? ul : el("div", { class: "sub", text: "直近のニュースは見つからず" }))));
  }

  const c = code(s.t);
  panel.append(el("div", { class: "section" }, el("h4", { text: "もっと調べる" }),
    el("div", { class: "link-row" },
      s.st !== "nodata" ? el("button", { class: "btn primary", onclick: () => askAI(s, "claude") }, "Claudeに聞く") : null,
      s.st !== "nodata" ? el("button", { class: "btn primary", onclick: () => askAI(s, "gemini") }, "Geminiに聞く") : null,
      s.st !== "nodata" && navigator.share ? el("button", { class: "btn", onclick: () => askAI(s, "share") }, "他のAIアプリで聞く") : null,
      el("a", { class: "btn", href: `https://kabutan.jp/stock/?code=${encodeURIComponent(c)}`, target: "_blank", rel: "noopener" }, "株探"),
      el("a", { class: "btn", href: `https://finance.yahoo.co.jp/quote/${encodeURIComponent(s.t)}`, target: "_blank", rel: "noopener" }, "Yahoo!ファイナンス"))));

  const sheet = $("#sheet");
  sheet.hidden = false;
  document.body.style.overflow = "hidden";
  if (!history.state?.sheet) history.pushState({ sheet: true }, "");
  closeBtn.focus({ preventScroll: true });
}

function closeDetail(fromPop) {
  const sheet = $("#sheet");
  if (sheet.hidden) return;
  sheet.hidden = true;
  document.body.style.overflow = "";
  if (!fromPop && history.state?.sheet) history.back();
}
window.addEventListener("popstate", () => closeDetail(true));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });
$("#sheet").addEventListener("click", (e) => { if (e.target.hasAttribute("data-close")) closeDetail(); });

async function loadChart(s) {
  if (state.demo) return false;
  try {
    const r = await fetch(`data/ch/${encodeURIComponent(code(s.t))}.json`, { cache: "no-cache" });
    if (!r.ok) return false;
    s.ch = await r.json();
    return true;
  } catch (_) { return false; }
}

function divWhy(s) {
  const d = s.dv;
  return `配当利回り${fmtY(d.y)}(直近1年で1株${d.ttm}円)。配当は年${d.m.length}回(${d.m.map((m) => m + "月").join("・")})。${d.cum ? `次の権利付最終日は${mdw(d.cum)}(推定)。` : ""}${d.tr ? d.tr + "。" : ""}`;
}

function evWhy(s) {
  const ev = state.data.events;
  const mine = (ev?.recent || []).filter((e) => e.t === s.t);
  return mine.map((e) => `${e.date.slice(5).replace("-", "/")} ${ev.types[e.type]}: ${e.title}`).join("\n") || "イベント情報なし";
}

/* 出来高急増: 過去の統計で平均が一番良かった利確・損切りを今の株価に当てはめる */
function volPlan(s) {
  const sec = el("div", { class: "section" }, el("h4", { text: "売買の目安(出来高急増の過去統計)" }), el("div", { class: "sub", text: "読み込み中…" }));
  getBacktest().then((bt) => {
    const vb = bt?.volume;
    const r = vb?.rules?.[0];
    const h20 = vb?.hold?.find((x) => x.days === 20);
    if (!r) { sec.lastChild.textContent = "過去の統計は次回の自動計算で表示されます。"; return; }
    sec.lastChild.replaceWith(el("div", {},
      el("div", { class: "plan" },
        stat("利確", `${yen(s.px * (1 + r.tp))}円`, `+${Math.round(r.tp * 100)}%`),
        stat("損切り", `${yen(s.px * (1 - r.sl))}円`, `-${Math.round(r.sl * 100)}%`),
        stat("期限", "60日", "営業日の目安")),
      el("div", { class: "plan-note", text: `今日の終値で買った場合。過去10年の出来高急増では、このルールで平均${fmtP(r.mean)}・勝率${fmtW(r.win)}(平均${Math.round(r.avg_days)}日)。20日持ちっぱなしなら平均${fmtP(h20?.mean)}・勝率${fmtW(h20?.win)}。投資判断は自分で。` })));
  });
  return sec;
}

/* 過去の統計で一番バランスが良かった売買ルールを、今の株価に当てはめた目安 */
function planSection(s) {
  const low = s.reb != null ? s.px / (1 + s.reb) : null;
  const tp15 = s.px * 1.15, tp30 = s.px * 1.3, sl20 = s.px * 0.8;
  const mk = state.data.market;
  return el("div", { class: "section" }, el("h4", { text: "売買の目安(過去の統計ベース)" }),
    el("div", { class: "plan" },
      stat("利確", `${yen(tp15)}円`, "+15%"),
      stat("損切り", low ? `${yen(low)}円` : `${yen(sl20)}円`, low ? `底値割れ(-${Math.round((1 - low / s.px) * 100)}%)` : "-20%"),
      stat("期限", "60日", "営業日の目安")),
    el("div", { class: "plan-note", text: `今日の終値で買った場合。大きく狙うなら 利確+30%(${yen(tp30)}円)/損切り-20%(${yen(sl20)}円)。過去10年の${isBest(s) ? "★ベスト条件" : "底打ち候補"}の平均的な成績から算出。${mk ? (mk.up ? "今は相場全体が上向きで、過去はシグナルが効きにくかった地合い。" : "今は相場全体が下向きで、過去はシグナルが効きやすかった地合い。") : ""}投資判断は自分で。` }));
}

function stat(label, value, hint) {
  return el("div", { class: "stat" }, el("div", { class: "l", text: label }), el("div", { class: "v", text: value }), hint ? el("div", { class: "h", text: hint }) : null);
}

function buildPrompt(s) {
  const e = s.earn || {};
  const earnTxt = !e.has_data ? "データなし" : `トレンド${e.trend}、売上前年比${pct(e.rev_yoy, true)}、${e.metric}前年比${pct(e.profit_yoy, true)}、前四半期比${pct(e.profit_qoq, true)}`;
  const news = (s.news || []).map((n) => `・[${n.d}] ${n.t}`).join("\n") || "なし";
  const refs = (state.data.refs || []).join("・") || "三菱電機・オムロン・キーエンス・ABEJA・円谷フィールズ";
  return `日本株のスクリーニングで引っかかった銘柄について、参考意見がほしい。
自分の「勝ちパターン」は、${refs}のような「長く下げて底打ちしたあと上がっていく」形。この銘柄がそれに当てはまりそうか、良い点と懸念点を簡潔に評価して。最新の決算やニュースも調べて補足して。最終判断は自分でするので参考意見でOK。

銘柄: ${s.n}(${code(s.t)}) / ${s.s}
最新終値: ${yen(s.px)}円
5年株価位置: ${pct(s.pos)}(0%=5年最安値)
直近3ヶ月: ${s.dec != null ? Math.round(s.dec * 100) : "-"}%下落 → 底から${pct(s.reb, true)}反発(底から${s.dsl}営業日)
${s.sim != null ? `勝ちパターン類似度(直近60日の形と、勝ちパターン銘柄が大きく上がる前の形の相関): ${s.sim.toFixed(2)}(一番近い: ${s.sim_ref || "-"})\n` : ""}${s.dv ? `配当: 利回り${fmtY(s.dv.y)}(年${s.dv.ttm}円・${s.dv.m.map((m) => m + "月").join("・")})\n` : ""}業績: ${earnTxt}
直近ニュース:
${news}`;
}

// Claude: URLで質問文ごと渡せる / Gemini: URLで渡す公式の方法がないので、コピーして開く(貼り付けて送信)
// 他のAIアプリ: スマホの共有メニューでGemini・ChatGPTなどのアプリに直接テキストを渡す
async function askAI(s, target) {
  const prompt = buildPrompt(s);
  if (target === "share") {
    try { await navigator.share({ title: `${s.n}について`, text: prompt }); } catch (_) { /* キャンセル */ }
    return;
  }
  // awaitすると新しいタブを開く操作がブロックされることがあるので、コピーは待たずに開く
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(prompt).catch(() => {});
  if (target === "gemini") {
    toast("質問文をコピーした。Geminiが開いたら貼り付けて送信してね");
    window.open("https://gemini.google.com/app", "_blank", "noopener");
  } else {
    toast("質問文をコピーした。Claudeが開くよ");
    window.open(`https://claude.ai/new?q=${encodeURIComponent(prompt)}`, "_blank", "noopener");
  }
}

/* ---------- 条件の効き目分析 ---------- */
async function loadFactors(box) {
  if (state.demo) { box.textContent = "デモでは表示されません(本番の計算結果にだけ付きます)。"; return; }
  const bt = await getBacktest();
  if (!bt?.factors) { box.textContent = "まだ分析結果がありません(次回の自動計算で作られます)。"; return; }
  renderFactors(box, bt.factors, "底打ちシグナル");
}

function renderFactors(box, fa, what) {
  const b = fa.base;
  const H = fa.horizon || 60;
  const f = (v) => (v == null ? "-" : `${v > 0 ? "+" : ""}${(v * 100).toFixed(1)}%`);
  const w = (v) => (v == null ? "-" : `${Math.round(v * 100)}%`);
  const all = fa.factors.flatMap((fc) => fc.buckets.map((x) => ({ ...x, factor: fc.label })));
  const minN = Math.max(100, Math.round(b.n * 0.02));
  const good = all.filter((x) => x.stable && x.n >= minN).sort((p, q) => q.mean60 - p.mean60).slice(0, 5);
  const bad = all.filter((x) => x.n >= minN && x.h1 != null && x.h2 != null && x.h1 < b.h1 && x.h2 < b.h2)
    .sort((p, q) => p.mean60 - q.mean60).slice(0, 5);
  const rankList = (arr, cls) => el("ol", { class: `rank ${cls}` }, ...arr.map((x) => el("li", {},
    el("span", { class: "rk-name" }, el("small", { text: x.factor }), x.label),
    el("span", { class: "rk-val" }, el("b", { text: f(x.mean60) }), el("small", { text: `勝率${w(x.win60)}・${x.n.toLocaleString()}件` })))));

  // 1つの条件ごとの棒グラフ(60日後の平均。縦線=全体平均)
  const maxAbs = Math.max(0.05, ...all.map((x) => Math.abs(x.mean60)));
  const factorBlock = (fc) => el("div", { class: "fa-block" },
    el("div", { class: "fa-title", text: fc.label }),
    ...fc.buckets.map((x) => {
      const pos = (v) => 50 + (v / maxAbs) * 50;
      const l = Math.min(pos(0), pos(x.mean60)), r = Math.max(pos(0), pos(x.mean60));
      return el("div", { class: "fa-row" },
        el("span", { class: "fa-lab", text: x.label }),
        el("span", { class: "fa-track" },
          el("i", { class: x.mean60 >= b.mean60 ? "fa-bar up" : "fa-bar", style: `left:${l}%;width:${Math.max(0.8, r - l)}%` }),
          el("i", { class: "fa-base", style: `left:${pos(b.mean60)}%` })),
        el("span", { class: "fa-num" }, el("b", { text: f(x.mean60) }), el("small", { text: `${w(x.win60)}${x.stable ? " ◎" : ""}` })));
    }));

  box.className = "";
  box.replaceChildren(
    el("p", { class: "sub", text: `過去10年の${what} ${b.n.toLocaleString()}回を、その日に分かっていた条件で分けて、${H}営業日後の成績を比べた。全体の平均は ${f(b.mean60)}(勝率${w(b.win60)})。` }),
    el("h5", { text: "効いていた条件 TOP5" }),
    good.length ? rankList(good, "good") : el("p", { class: "sub", text: "該当なし" }),
    el("h5", { text: "避けた方がよかった条件" }),
    bad.length ? rankList(bad, "bad") : el("p", { class: "sub", text: "該当なし" }),
    el("p", { class: "muted", style: "font-size:12px;margin:6px 0 0", text: "どちらも前半(〜2021年)と後半(2022年〜)の両方で全体平均より良かった/悪かったものだけ(たまたまを除くため)。" }),
    ...(fa.pairs?.length ? [
      el("h5", { text: "組み合わせで良かったもの" }),
      el("ol", { class: "rank good" }, ...fa.pairs.slice(0, 8).map((x) => el("li", {},
        el("span", { class: "rk-name" }, el("small", { text: `${x.n.toLocaleString()}件・2020年除く ${f(x.ex2020)}` }), `${x.a} × ${x.b}`),
        el("span", { class: "rk-val" }, el("b", { text: f(x.mean60) }), el("small", { text: `勝率${w(x.win60)}` }))))),
    ] : []),
    el("h5", { text: `条件ごとの成績(${H}日後の平均)` }),
    el("p", { class: "muted", style: "font-size:12px;margin:0 0 4px", text: "縦線=全体平均。色付き=全体平均より上。◎=前半・後半とも全体平均超え。右の%は勝率。" }),
    ...fa.factors.map(factorBlock),
  );
}

/* ---------- 過去の成績(バックテスト) ---------- */
async function loadBacktest(box) {
  if (state.demo) { box.textContent = "デモでは表示されません(本番の計算結果にだけ付きます)。"; return; }
  const bt = await getBacktest();
  if (!bt) {
    box.textContent = "まだバックテスト結果がありません(次回の自動計算で作られます)。";
    return;
  }
  const f = (v) => (v == null ? "-" : `${v > 0 ? "+" : ""}${(v * 100).toFixed(1)}%`);
  const w = (v) => (v == null ? "-" : `${Math.round(v * 100)}%`);
  const table = (head, rows, bestIdx) => el("div", { class: "tbl-wrap" }, el("table", { class: "tbl" },
    el("thead", {}, el("tr", {}, ...head.map((h) => el("th", { text: h })))),
    el("tbody", {}, ...rows.map((r, i) => el("tr", { class: i === bestIdx ? "best" : null }, ...r.map((c) => el("td", { text: c })))))));
  box.className = "";
  box.replaceChildren(
    el("p", { class: "sub", text: `${bt.period.from}〜${bt.period.to} の全${bt.stocks.toLocaleString()}銘柄で、今と同じ条件(底値圏+3ヶ月底打ち)のシグナルが出た${bt.events.toLocaleString()}回について、翌営業日の終値で買ったと仮定して集計。` }),
    el("h5", { text: "何日持つと良かったか" }),
    table(["保有", "平均", "中央値", "勝率", "適当買い平均", "適当買い勝率"],
      bt.hold.map((r) => [`${r.days}日`, f(r.mean), f(r.median), w(r.win), f(r.base_mean), w(r.base_win)])),
    el("p", { class: "muted", style: "font-size:12px;margin:4px 0 0", text: "「適当買い」= 同じ銘柄をランダムな日に買った場合。これより上なら条件に意味がある。" }),
    ...(bt.by_regime && bt.by_regime.length ? [
      el("h5", { text: "相場全体の地合い別" }),
      table(["地合い", "60日平均", "60日勝率", "120日平均", "120日勝率"],
        bt.by_regime.map((r) => [r.regime === "up" ? "上向き" : "下向き", f(r.h60.mean), w(r.h60.win), f(r.h120.mean), w(r.h120.win)])),
      el("p", { class: "muted", style: "font-size:12px;margin:4px 0 0", text: `上向き/下向き = ${bt.by_regime[0].label.includes("TOPIX") ? "TOPIX" : "全銘柄の中央値指数"}がシグナル日に200日移動平均より上/下だったか。` }),
    ] : []),
    ...simSection(bt.by_similarity, table, f, w),
    el("h5", { text: "利確・損切りの組み合わせ(平均リターン上位10)" }),
    table(["利確", "損切り", "平均", "勝率", "平均日数"],
      bt.grid.slice(0, 10).map((r) => [`+${Math.round(r.tp * 100)}%`, r.sl === "floor" ? "底値割れ" : `-${Math.round(r.sl * 100)}%`, f(r.mean), w(r.win), `${Math.round(r.avg_days)}日`]), 0),
    el("h5", { text: "60日持つ間の最大含み損・含み益" }),
    el("p", { class: "sub", style: "margin:2px 0 0", text: `含み損: 半分の取引は最悪 ${f(bt.excursion60.mae_med)} まで、4分の1は ${f(bt.excursion60.mae_p25)} 以上下げた` }),
    el("p", { class: "sub", style: "margin:2px 0 0", text: `含み益: 半分の取引は途中で ${f(bt.excursion60.mfe_med)} まで、4分の1は ${f(bt.excursion60.mfe_p75)} 以上上げた` }),
    el("h5", { text: "年ごと(60日保有)" }),
    table(["年", "件数", "平均", "勝率"], bt.by_year.map((r) => [String(r.year), (r.n || 0).toLocaleString(), f(r.mean), w(r.win)])),
    el("ul", { class: "cav" }, ...(bt.caveats || []).map((c) => el("li", { text: c }))),
  );
}

const SIM_SHORT = {
  all: "通常シグナル全部", first_90: "通常×類似90%↑", first_80: "通常×類似80-90%", first_70: "通常×類似70-80%", first_lo: "通常×類似70%未満",
  near_90: "底値圏×類似90%↑ 即買い", near_95: "底値圏×類似95%↑ 即買い", sig_90: "★底打ち×類似90%↑", post_90: "旧方式(上昇後の形)90%↑",
};

const COMBO_SHORT = {
  all_down: "底打ち × 下向き", all_up: "底打ち × 上向き", sig_90_down: "★ベスト × 下向き", sig_90_up: "★ベスト × 上向き",
  near_90_down: "即買い90% × 下向き", near_90_up: "即買い90% × 上向き",
};

function simSection(bs, table, f, w) {
  if (!bs) return [];
  const rows = [bs.all, ...bs.first, ...bs.hit];
  const hd = (r, d) => r.hold.find((x) => x.days === d) || {};
  const rl = (r, tp, sl) => r.rules.find((x) => x.tp === tp && x.sl === sl) || {};
  const best = rows.reduce((bi, r, i) => ((hd(r, 60).mean ?? -9) > (hd(rows[bi], 60).mean ?? -9) && r.events >= 100 ? i : bi), 0);
  const y = bs.hit.find((r) => r.key === "near_90");
  return [
    el("h5", { text: "勝ちパターン類似度で買ったら" }),
    el("p", { class: "sub", style: "margin:2px 0 6px", text: `類似度 = 直近${bs.window || 60}日の形が、勝ちパターン銘柄が大きく上がる"前"(底〜底の20日後)の形にどれだけ似ているか。各日その日までの株価だけで計算。` }),
    table(["買い方", "件数", "底から", "60日", "120日", "250日"],
      rows.map((r) => [SIM_SHORT[r.key] || r.label, (r.events || 0).toLocaleString(), f(r.from_low_med),
        `${f(hd(r, 60).mean)}\n${w(hd(r, 60).win)}`, `${f(hd(r, 120).mean)}\n${w(hd(r, 120).win)}`, `${f(hd(r, 250).mean)}\n${w(hd(r, 250).win)}`]), best),
    el("p", { class: "muted", style: "font-size:12px;margin:4px 0 0", text: "上段=平均、下段=勝率。「底から」= 買った時点で直近3ヶ月の最安値から既に何%上がっていたか(小さいほど早く乗れている)。「即買い」は反発を待たずに、形が似た日に買う。" }),
    ...(bs.combo && bs.combo.length ? [
      el("h5", { text: "地合いとの組み合わせ" }),
      table(["買い方", "件数", "60日", "2020年除く", "+15%/底値割れ"],
        [bs.all, ...bs.hit.filter((r) => r.key === "sig_90"), ...bs.combo].map((r) => {
          const r15 = rl(r, 0.15, "floor"), ex = r.h60_ex2020 || {};
          return [COMBO_SHORT[r.key] || SIM_SHORT[r.key] || r.label, (r.events || 0).toLocaleString(),
            `${f(hd(r, 60).mean)}\n${w(hd(r, 60).win)}`, ex.n ? `${f(ex.mean)}\n${w(ex.win)}` : "-",
            r15.n ? `${f(r15.mean)}\n${w(r15.win)}` : "-"];
        })),
      el("p", { class: "muted", style: "font-size:12px;margin:4px 0 0", text: "下向き/上向き = 買った日に日本株全体(全銘柄の平均)が200日移動平均より下/上。「2020年除く」はコロナ後の急反発を除いた60日の成績。" }),
    ] : []),
    ...(y && y.by_year.length ? [
      el("h5", { text: "底値圏で類似度90%超え→即買い の年ごと(60日)" }),
      table(["年", "件数", "平均", "勝率"], y.by_year.map((r) => [String(r.year), (r.n || 0).toLocaleString(), f(r.mean), w(r.win)])),
    ] : []),
  ];
}

/* ---------- グラフ(線グラフのみ) ---------- */
function decodeSeries(p) {
  const base = new Date(p.b + "T00:00:00");
  return { xs: p.x.map((d) => new Date(base.getTime() + d * 864e5)), ys: p.y };
}

function chartSection(s) {
  const modes = [["w", "5年"], ["d", "3ヶ月"]];
  if (s.cmp) modes.push(["cmp", "勝ちパターンと比較"]);
  let mode = recall("chartMode", "w");
  if (!modes.some(([m]) => m === mode)) mode = "w";
  const seg = el("div", { class: "seg", role: "group", "aria-label": "グラフの期間" });
  const card = el("div", { class: "chart-card" });
  const draw = () => {
    for (const b of seg.children) b.setAttribute("aria-pressed", String(b.dataset.m === mode));
    card.replaceChildren();
    requestAnimationFrame(() => renderChart(card, s, mode));
  };
  for (const [m, label] of modes) {
    seg.append(el("button", { "data-m": m, onclick: () => { mode = m; store("chartMode", m); draw(); } }, label));
  }
  const sec = el("div", { class: "section" }, el("h4", { text: "チャート" }), seg, card);
  setTimeout(draw, 0);
  return sec;
}

function renderChart(card, s, mode) {
  const p = state.data.params || {};
  if (mode === "cmp" && s.cmp.b_at) {
    // 新方式: 今日=100。勝ちパターンは"同じ形だった日"を今日に重ね、その後の動き(点線)まで表示
    const a = s.cmp.a, b = s.cmp.b;
    const n = a.length;
    const series = [
      { name: s.n, xs: a.map((_, i) => i - n + 1), ys: a, color: "var(--s1)" },
      { name: s.sim_ref || "勝ちパターン", xs: b.map((_, i) => i - n + 1), ys: b, color: "var(--s2)", dashFrom: n - 1 },
    ];
    card.append(el("div", { class: "chart-title" },
      el("span", { text: "今日=100。点線は勝ちパターンのその後" }),
      el("span", { class: "legend" }, ...series.map((sr) => el("span", {}, el("i", { style: `background:${sr.color}` }), sr.name)))));
    const after = b.length > n ? b[b.length - 1] - 100 : null;
    lineChart(card, { series, xKind: "rel", baseline: 100, vline: { x: 0, label: "今日" }, yFmt: (v) => v.toFixed(0), valFmt: (v) => v.toFixed(1),
      note: `${s.sim_ref}の${s.cmp.b_at.replace(/-/g, "/")}(底の${s.cmp.k}営業日後)と形が似ている${after != null ? `。そこから${b.length - n}営業日で${after > 0 ? "+" : ""}${after.toFixed(0)}%` : ""}` });
    return;
  }
  if (mode === "cmp") {
    const a = s.cmp.a, b = s.cmp.b;
    const series = [
      { name: s.n, xs: a.map((_, i) => i), ys: a, color: "var(--s1)" },
      { name: s.sim_ref || "勝ちパターン", xs: b.map((_, i) => i), ys: b, color: "var(--s2)" },
    ];
    card.append(el("div", { class: "chart-title" },
      el("span", { text: "底の日=100として、そこからの動き" }),
      el("span", { class: "legend" }, ...series.map((sr) => el("span", {}, el("i", { style: `background:${sr.color}` }), sr.name)))));
    lineChart(card, { series, xKind: "day", baseline: 100, yFmt: (v) => v.toFixed(0), valFmt: (v) => v.toFixed(1),
      note: s.cmp.b_from ? `${s.sim_ref}は${s.cmp.b_from.replace(/-/g, "/")}の底から` : null });
    return;
  }
  const { xs, ys } = decodeSeries(s.ch[mode]);
  const series = [{ name: s.n, xs, ys, color: "var(--s1)" }];
  card.append(el("div", { class: "chart-title" }, el("span", { text: mode === "w" ? "終値(週足・5年)" : "終値(日足・3ヶ月)" })));
  const lo = Math.min(...ys), hi = Math.max(...ys);
  const opts = { series, xKind: "date", span: mode, yFmt: yen, valFmt: (v) => `${yen(v)}円` };
  if (mode === "w") opts.hline = { y: lo + (hi - lo) * (p.near_low ?? 0.3), label: "底値圏ライン" };
  if (mode === "d" && s.low_d) {
    const t = new Date(s.low_d + "T00:00:00").getTime();
    let bi = 0, bd = Infinity;
    xs.forEach((x, i) => { const dd = Math.abs(x.getTime() - t); if (dd < bd) { bd = dd; bi = i; } });
    opts.mark = { i: bi, label: "底" };
  }
  lineChart(card, opts);
}

function niceTicks(lo, hi, n = 4) {
  const span = hi - lo || Math.abs(hi) || 1;
  const raw = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((st) => st >= raw) || 10 * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

function lineChart(host, o) {
  const wrap = el("div", { class: "chart" });
  host.append(wrap);
  const W = Math.max(280, wrap.clientWidth || host.clientWidth - 20);
  const H = 220;
  const m = { l: 50, r: 16, t: 14, b: 28 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const allX = o.series.flatMap((sr) => sr.xs.map((x) => (x instanceof Date ? x.getTime() : x)));
  const allY = o.series.flatMap((sr) => sr.ys);
  if (o.baseline != null) allY.push(o.baseline);
  if (o.hline) allY.push(o.hline.y);
  const x0 = Math.min(...allX), x1 = Math.max(...allX);
  let y0 = Math.min(...allY), y1 = Math.max(...allY);
  const pad = (y1 - y0) * 0.08 || 1;
  y0 -= pad; y1 += pad;
  const X = (x) => m.l + ((x instanceof Date ? x.getTime() : x) - x0) / (x1 - x0 || 1) * iw;
  const Y = (y) => m.t + (1 - (y - y0) / (y1 - y0 || 1)) * ih;

  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": o.series.map((s) => s.name).join("と") + "の推移" });
  const g = sv("g", {});
  svg.append(g);

  // grid + y ticks
  for (const t of niceTicks(y0, y1, 4)) {
    g.append(sv("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: "var(--grid)", "stroke-width": 1 }));
    const tx = sv("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)", style: "font-variant-numeric:tabular-nums" });
    tx.textContent = o.yFmt(t);
    g.append(tx);
  }
  // x ticks
  const xt = [];
  if (o.xKind === "date") {
    const d0 = new Date(x0), d1 = new Date(x1);
    if (o.span === "w") {
      for (let y = d0.getFullYear() + 1; y <= d1.getFullYear(); y++) xt.push([new Date(y, 0, 1).getTime(), `${y}`]);
    } else {
      const c = new Date(d0.getFullYear(), d0.getMonth() + 1, 1);
      while (c.getTime() <= x1) { xt.push([c.getTime(), `${c.getMonth() + 1}月`]); c.setMonth(c.getMonth() + 1); }
    }
  } else if (o.xKind === "rel") {
    for (let d = Math.ceil(x0 / 20) * 20; d <= x1; d += 20) xt.push([d, d === 0 ? "今日" : d < 0 ? `${-d}日前` : `${d}日後`]);
  } else {
    for (let d = 0; d <= x1; d += 10) xt.push([d, d === 0 ? "底" : `${d}日後`]);
  }
  g.append(sv("line", { x1: m.l, x2: W - m.r, y1: m.t + ih, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1 }));
  for (const [v, label] of xt) {
    const x = m.l + (v - x0) / (x1 - x0 || 1) * iw;
    if (x < m.l - 1 || x > W - m.r + 1) continue;
    const tx = sv("text", { x, y: H - 8, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
    tx.textContent = label;
    g.append(tx);
  }
  if (o.baseline != null) g.append(sv("line", { x1: m.l, x2: W - m.r, y1: Y(o.baseline), y2: Y(o.baseline), stroke: "var(--axis)", "stroke-width": 1 }));
  if (o.hline) {
    g.append(sv("rect", { x: m.l, y: Y(o.hline.y), width: iw, height: Math.max(0, m.t + ih - Y(o.hline.y)), fill: "var(--s1)", "fill-opacity": 0.07 }));
    g.append(sv("line", { x1: m.l, x2: W - m.r, y1: Y(o.hline.y), y2: Y(o.hline.y), stroke: "var(--axis)", "stroke-width": 1 }));
    const tx = sv("text", { x: m.l + 6, y: Y(o.hline.y) - 5, "font-size": 11, fill: "var(--ink2)" });
    tx.textContent = o.hline.label;
    g.append(tx);
  }

  // lines
  if (o.vline) {
    g.append(sv("line", { x1: X(o.vline.x), x2: X(o.vline.x), y1: m.t, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1, "stroke-dasharray": "3 3" }));
  }
  for (const sr of o.series) {
    const pth = (from, to) => sr.xs.slice(from, to).map((x, j) => `${j ? "L" : "M"}${X(x).toFixed(1)},${Y(sr.ys[from + j]).toFixed(1)}`).join("");
    const cut = sr.dashFrom != null && sr.dashFrom < sr.xs.length - 1 ? sr.dashFrom : sr.xs.length - 1;
    g.append(sv("path", { d: pth(0, cut + 1), fill: "none", stroke: sr.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    if (cut < sr.xs.length - 1) {
      g.append(sv("path", { d: pth(cut, sr.xs.length), fill: "none", stroke: sr.color, "stroke-width": 2, "stroke-dasharray": "4 4", "stroke-linecap": "round", opacity: 0.8 }));
    }
    const li = sr.xs.length - 1;
    g.append(sv("circle", { cx: X(sr.xs[li]), cy: Y(sr.ys[li]), r: 4, fill: sr.color, stroke: "var(--surface)", "stroke-width": 2 }));
  }
  if (o.mark) {
    const sr = o.series[0];
    const cx = X(sr.xs[o.mark.i]), cy = Y(sr.ys[o.mark.i]);
    g.append(sv("circle", { cx, cy, r: 5, fill: "var(--surface)", stroke: sr.color, "stroke-width": 2 }));
    const tx = sv("text", { x: cx, y: cy + 18, "text-anchor": "middle", "font-size": 11, "font-weight": 700, fill: "var(--ink2)" });
    tx.textContent = o.mark.label;
    g.append(tx);
  }

  // crosshair + tooltip
  const cross = sv("line", { y1: m.t, y2: m.t + ih, stroke: "var(--ink2)", "stroke-width": 1, visibility: "hidden" });
  const dots = o.series.map((sr) => sv("circle", { r: 4, fill: sr.color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }));
  svg.append(cross, ...dots);
  const hit = sv("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "transparent", tabindex: 0 });
  svg.append(hit);
  wrap.append(svg);
  const tip = el("div", { class: "tip", hidden: true });
  wrap.append(tip);

  const ref = o.series.reduce((a, b) => (b.xs.length > a.xs.length ? b : a)); // 一番長い系列でX位置を拾う
  let cur = -1;
  function show(i) {
    i = Math.max(0, Math.min(ref.xs.length - 1, i));
    cur = i;
    const x = X(ref.xs[i]);
    cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
    o.series.forEach((sr, k) => {
      if (i < sr.ys.length) {
        dots[k].setAttribute("cx", X(sr.xs[i])); dots[k].setAttribute("cy", Y(sr.ys[i])); dots[k].setAttribute("visibility", "visible");
      } else dots[k].setAttribute("visibility", "hidden");
    });
    const xv = ref.xs[i];
    const head = xv instanceof Date ? `${xv.getFullYear()}/${xv.getMonth() + 1}/${xv.getDate()}`
      : o.xKind === "rel" ? (xv === 0 ? "今日" : xv < 0 ? `${-xv}営業日前` : `${xv}営業日後(勝ちパターンのその後)`)
      : xv === 0 ? "底の日" : `底から${xv}日後`;
    tip.replaceChildren(el("div", { text: head }),
      ...o.series.filter((sr) => i < sr.ys.length).map((sr) => el("div", { class: "r" }, el("i", { style: `background:${sr.color}` }), el("b", { text: o.valFmt(sr.ys[i]) }), o.series.length > 1 ? sr.name : null)));
    tip.hidden = false;
    const scale = wrap.clientWidth / W;
    const px = x * scale;
    const tw = tip.offsetWidth;
    tip.style.left = `${Math.min(Math.max(0, px - tw / 2), wrap.clientWidth - tw)}px`;
    tip.style.top = "0px";
  }
  function hide() { cross.setAttribute("visibility", "hidden"); dots.forEach((d) => d.setAttribute("visibility", "hidden")); tip.hidden = true; cur = -1; }
  function idxAt(clientX) {
    const r = svg.getBoundingClientRect();
    const vx = (clientX - r.left) * (W / r.width);
    let best = 0, bd = Infinity;
    ref.xs.forEach((x, i) => { const d = Math.abs(X(x) - vx); if (d < bd) { bd = d; best = i; } });
    return best;
  }
  hit.addEventListener("pointerdown", (e) => show(idxAt(e.clientX)));
  hit.addEventListener("pointermove", (e) => show(idxAt(e.clientX)));
  hit.addEventListener("pointerleave", hide);
  hit.addEventListener("pointercancel", hide);
  hit.addEventListener("focus", () => { if (cur < 0) show(ref.xs.length - 1); });
  hit.addEventListener("blur", hide);
  hit.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { show((cur < 0 ? ref.xs.length : cur) - 1); e.preventDefault(); }
    if (e.key === "ArrowRight") { show((cur < 0 ? -1 : cur) + 1); e.preventDefault(); }
  });
  if (o.note) host.append(el("div", { class: "chart-title", style: "padding-top:4px" }, el("span", { class: "muted", text: o.note })));
}

/* ---------- デモデータ(架空) ---------- */
function makeDemo() {
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const genres = { "テクノロジー": ["半導体", "FA(ファクトリーオートメーション)", "AI"], "インフラ・防衛": ["防衛", "宇宙"], "消費・生活": ["インバウンド・観光"], "エネルギー・資源": ["再生可能エネルギー"], "金融・商社": ["総合商社"] };
  const sectors = ["機械", "電気機器", "精密機器", "化学", "情報・通信業", "サービス業", "卸売業", "小売業", "輸送用機器", "医薬品"];
  const themes = Object.values(genres).flat();
  const end = new Date(); end.setHours(0, 0, 0, 0);
  const days = 1230;
  const stocks = [];
  for (let k = 0; k < 160; k++) {
    const kind = k < 9 ? "pass" : k < 30 ? "nobottom" : k < 150 ? "high" : "nodata";
    const name = `デモ銘柄${String(k + 1).padStart(3, "0")}`;
    const t = `${9000 + k}.T`;
    const s = sectors[k % sectors.length];
    const th = k % 3 === 0 ? [themes[k % themes.length]] : [];
    if (kind === "nodata") { stocks.push({ t, n: name, s, th, st: kind }); continue; }
    const ys = []; let v = 800 + rnd() * 3000;
    for (let i = 0; i < days; i++) {
      v *= Math.exp(gauss() * 0.013 + (kind === "high" ? 0.0006 : 0.0002));
      ys.push(v);
    }
    if (kind !== "high") {
      const top = Math.max(...ys.slice(0, days - 70)) * (0.9 + rnd() * 0.1);
      for (let i = days - 400; i < days - 60; i++) ys[i] = top * (1 - 0.35 * (i - (days - 400)) / 340) * Math.exp(gauss() * 0.01);
      const lowV = ys[days - 61] * (kind === "pass" ? 0.78 : 0.93);
      for (let i = days - 60; i < days - 35; i++) ys[i] = ys[days - 61] + (lowV - ys[days - 61]) * (i - (days - 60)) / 25 * (1 + gauss() * 0.01);
      const up = kind === "pass" ? 1.12 + rnd() * 0.15 : 1.03;
      for (let i = days - 35; i < days; i++) ys[i] = lowV * (1 + (up - 1) * (i - (days - 35)) / 35) * Math.exp(gauss() * 0.008);
    }
    const dates = []; for (let i = 0; i < days; i++) dates.push(new Date(end.getTime() - (days - 1 - i) * 1.4 * 864e5));
    const lo = Math.min(...ys), hi = Math.max(...ys), px = ys[days - 1];
    const win = ys.slice(-63); const li = win.indexOf(Math.min(...win));
    const pre = Math.max(...win.slice(0, li + 1));
    const rec = { t, n: name, s, th, px: +px.toPrecision(5), pos: +((px - lo) / (hi - lo)).toFixed(3), yrs: 4.9,
      dec: +((pre - win[li]) / pre).toFixed(3), reb: +((px - win[li]) / win[li]).toFixed(3), dsl: 62 - li, st: kind };
    if (kind === "nobottom") {
      rec.sim = +(0.5 + rnd() * 0.45).toFixed(3); rec.sim_ref = ["三菱電機", "オムロン", "キーエンス"][k % 3];
    }
    if (kind === "pass") {
      rec.pos = Math.min(rec.pos, 0.28);
      const enc = (idx) => { const b = dates[idx[0]]; return { b: b.toISOString().slice(0, 10), x: idx.map((i) => Math.round((dates[i] - b) / 864e5)), y: idx.map((i) => +ys[i].toPrecision(4)) }; };
      const weekly = []; for (let i = 0; i < days; i += 5) weekly.push(i); weekly.push(days - 1);
      const daily = []; for (let i = days - 63; i < days; i++) daily.push(i);
      rec.ch = { w: enc(weekly), d: enc(daily) };
      rec.low_d = dates[days - 63 + li].toISOString().slice(0, 10);
      const a = ys.slice(-60).map((y) => +(y / px * 100).toFixed(1));
      const b = a.map((y) => +(100 + (y - 100) * (0.8 + 0.3 * rnd())).toFixed(1))
        .concat(Array.from({ length: 60 }, (_, i) => +(100 + (i + 1) * (0.3 + 0.4 * rnd())).toFixed(1)));
      const refs = ["三菱電機", "オムロン", "キーエンス", "ABEJA", "円谷フィールズ"];
      rec.sim = +(0.75 + rnd() * 0.23).toFixed(3); rec.sim_ref = refs[k % refs.length];
      rec.cmp = { a, b, b_at: "2023-11-08", k: 8 };
      rec.earn = k % 3 === 2 ? { has_data: false, trend: "データ不足" } : { has_data: true, trend: k % 2 ? "改善" : "横ばい", metric: "営業利益", rev_yoy: 0.08, profit_yoy: k % 2 ? 0.21 : -0.02, profit_qoq: 0.05 };
      rec.news = [{ d: "09/20", t: "(デモ)架空のニュース見出しがここに並びます", u: "" }];
      if (k % 3 === 0) rec.vs = { r: +(3 + rnd() * 8).toFixed(1), d: +(0.03 + rnd() * 0.12).toFixed(4), to: Math.round(50 + rnd() * 3000), hi: k % 2 === 0, pos: rec.pos, pre: -0.05, age: k % 3, date: "2026-09-24", since: 0.02 };
      if (k < 3) rec.ai = { score: +(0.8 - k * 0.07).toFixed(2), comment: "(デモ)AI評価のコメントがここに出ます。良い点と懸念点を2〜3文で。" };
    }
    stocks.push(rec);
  }
  const my = [], mma = []; let mv = 100;
  for (let i = 0; i < 450; i++) { mv *= Math.exp(gauss() * 0.009 + (i < 300 ? 0.0006 : -0.0012)); my.push(mv); }
  for (let i = 0; i < 450; i++) mma.push(i < 199 ? null : my.slice(i - 199, i + 1).reduce((a, b) => a + b, 0) / 200);
  const market = { label: "日本株全体(全銘柄の平均)", up: my[449] > mma[449], gap: +(my[449] / mma[449] - 1).toFixed(4), date: "",
    chart: { b: "", x: [], y: my.slice(200).map((v) => +v.toFixed(2)), ma: mma.slice(200).map((v) => +v.toFixed(2)) } };
  const passS = stocks.filter((x) => x.st === "pass");
  const events = { types: { buyback: "自社株買い", split: "株式分割", upward: "上方修正", dividend: "増配" }, since: "2026-09-01",
    recent: passS.slice(0, 5).map((x, i) => ({ t: x.t, n: x.n, type: ["buyback", "split", "upward", "dividend", "buyback"][i], date: "2026-09-2" + i,
      title: `(デモ)${x.n}、${["自社株買いを発表", "1株を3株に株式分割", "今期経常を上方修正", "増配を発表", "自己株式取得を決議"][i]}`, url: "", src: "デモ", now: 0.03 * (i - 1) })),
    stats: [{ type: "buyback", label: "自社株買い", n: 12, d1: { n: 10, mean: 0.021, win: 0.7 }, d5: { n: 8, mean: 0.015, win: 0.6 } },
      { type: "split", label: "株式分割", n: 5 }, { type: "upward", label: "上方修正", n: 20, d1: { n: 18, mean: 0.034, win: 0.72 } }, { type: "dividend", label: "増配", n: 7 }] };
  return { market, events, generated_at: new Date().toISOString(), universe_count: stocks.length, params: { near_low: 0.3, min_decline: 0.15, min_rebound: 0.1 },
    genres, sectors, refs: ["三菱電機", "オムロン", "キーエンス", "ABEJA", "円谷フィールズ"], stocks };
}
